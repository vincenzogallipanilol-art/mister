<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MISTER – Gestionale squadre</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MISTER">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/svg+xml" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="shim.js"></script>
<style>
:root{--bg:#0e0e10;--bg2:#151517;--card:#1c1c1f;--line:#2b2b30;--tx:#f2f4f7;--mut:#9096a0;--ac:#d1ff42;--ac2:#c7d1dd;--gold:#f5c542;--red:#ef4444;--yel:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
header h1{margin:0;font-size:18px;letter-spacing:2px;font-weight:800}
header h1 span{color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#121214;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--ac)}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:18px 0 8px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.grow{flex:1}
.wrap{flex-wrap:wrap}
button,select,input[type=text],input[type=number]{font:inherit}
.btn{background:var(--ac);color:#12160a;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.dan{background:#3b1519;color:#fca5a5;border:1px solid #6b1f26}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.blk{width:100%}
input[type=text],input[type=number],select{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--tx);cursor:pointer;user-select:none}
.chip.on{background:var(--ac);color:#12160a;border-color:var(--ac);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.mut{color:var(--mut)}
.small{font-size:12px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.cardw{filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));cursor:pointer}
.card{--c1:#f2d27a;--c2:#c9932b;--c3:#fff3c4;--tx:#2b1d00;--ac:#5a3d00;container-type:inline-size;position:relative;aspect-ratio:5/7.5;color:var(--tx);overflow:hidden;
 clip-path:polygon(50% 0,86% 2.5%,100% 7%,100% 88%,88% 94%,50% 100%,12% 94%,0 88%,0 7%,14% 2.5%);
 background:radial-gradient(120% 70% at 50% 0%,var(--c3) 0%,transparent 60%),linear-gradient(165deg,var(--c1),var(--c2))}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 45%,transparent 55%);pointer-events:none}
.card:after{content:"";position:absolute;inset:2.5cqw;border:.6cqw solid rgba(255,255,255,.35);clip-path:inherit;pointer-events:none}
.card.t1{--c1:#d59a6a;--c2:#8a4f26;--c3:#f3c9a0;--tx:#2b1406;--ac:#4a250d}
.card.t2{--c1:#dfe4ec;--c2:#8f9bb0;--c3:#ffffff;--tx:#1a2333;--ac:#334259}
.card.t3{--c1:#f7dc82;--c2:#c8901f;--c3:#fff6cd;--tx:#2b1d00;--ac:#5a3d00}
.card.t4{--c1:#1f78e0;--c2:#081a44;--c3:#5fd8ff;--tx:#fff;--ac:#7df9ff}
.card.t5{--c1:#fffdf3;--c2:#d8c58a;--c3:#ffffff;--tx:#231a05;--ac:#7a5d10}
.c-left{position:absolute;left:10cqw;top:13cqw;line-height:1;text-align:center;z-index:3;width:20cqw}
.c-ovr{font-size:18cqw;font-weight:800;letter-spacing:-.5cqw;font-variant-numeric:tabular-nums}
.c-role{font-size:7.2cqw;font-weight:700;letter-spacing:.4cqw;margin-top:1.5cqw;opacity:.9}
.c-sep{width:9cqw;height:.5cqw;background:var(--ac);opacity:.45;margin:3cqw auto}
.c-num{font-size:6.4cqw;font-weight:700;opacity:.75}
.c-ph{position:absolute;right:2cqw;top:8cqw;width:60cqw;height:62cqw;z-index:2;-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent);display:flex;align-items:flex-end;justify-content:center}
.c-ph img{width:100%;height:100%;object-fit:cover;object-position:center top}
.c-ph span{font-size:22cqw;font-weight:800;opacity:.22;align-self:center}
.c-name{position:absolute;left:8cqw;right:8cqw;top:71cqw;text-align:center;font-weight:800;font-size:8.6cqw;text-transform:uppercase;letter-spacing:.6cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
.c-meta{position:absolute;left:0;right:0;top:82cqw;text-align:center;font-size:5cqw;font-weight:600;letter-spacing:.2cqw;opacity:.7;z-index:3}
.c-st{position:absolute;left:15cqw;right:15cqw;top:90.5cqw;display:grid;grid-template-columns:1fr 1fr;column-gap:9cqw;row-gap:2cqw;z-index:3;border-top:.5cqw solid rgba(0,0,0,.2);padding-top:3cqw;position:absolute}
.card.t4 .c-st{border-color:rgba(255,255,255,.3)}
.c-st div{display:flex;align-items:baseline;justify-content:space-between;font-size:6.2cqw;font-weight:600;letter-spacing:.3cqw;opacity:.95}
.c-st b{font-size:8.4cqw;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;order:2}
.c-st span{opacity:.75;order:1}
.c-form{font-size:5.4cqw;font-weight:800;margin-top:2.5cqw}
.c-form.up{color:#0b7a3f}.c-form.dn{color:#b3261e}
.card.t4 .c-form.up{color:#7dffb0}.card.t4 .c-form.dn{color:#ffb4ab}
.formb{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:800}
.formb.up{background:#2b3512;color:#34d399}.formb.dn{background:#3b1519;color:#fca5a5}.formb.z{background:var(--bg2);color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.ev-card{border-left:4px solid var(--ac)}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.rsvp button{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 4px;font-size:13px;cursor:pointer}
.rsvp button.on.y{background:#2b3512;border-color:#34d399;color:#34d399;font-weight:700}
.rsvp button.on.m{background:#3f3a10;border-color:#facc15;color:#facc15;font-weight:700}
.rsvp button.on.n{background:#3b1519;border-color:#f87171;color:#fca5a5;font-weight:700}
textarea{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;background:var(--bg2);color:var(--mut);border:1px solid var(--line)}
/* avatar */
.av{border-radius:50%;background:var(--bg2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
/* player detail */
.pd-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.pd-photo{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:800;color:var(--mut)}
.pd-photo img{width:100%;height:100%;object-fit:cover}
.pd-ovr{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);border-radius:10px;padding:2px 10px;font-size:26px;font-weight:900;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.tile b{display:block;font-size:20px}
.tile span{font-size:11px;color:var(--mut)}
.attr{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.attr div{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
.v{font-weight:800}
.v.h{color:#34d399}.v.m{color:#a3e635}.v.l{color:#fb923c}.v.z{color:#f87171}
/* pitch */
.pitch{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;background:repeating-linear-gradient(0deg,#1f7a3d 0 10%,#238545 10% 20%);border:2px solid #dfe9e1;overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.6)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border:2px solid rgba(255,255,255,.6);border-radius:50%}
.box{position:absolute;left:25%;right:25%;height:14%;border:2px solid rgba(255,255,255,.6)}
.box.t{top:0;border-top:0}.box.b{bottom:0;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;z-index:2;touch-action:none;cursor:pointer}
.slot .circ{width:46px;height:46px;margin:0 auto;border-radius:50%;border:2px dashed rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;background:rgba(0,0,0,.18);position:relative}
.slot.f .circ{border:2px solid #fff;background:var(--card)}
.slot.sel .circ{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.5)}
.slot .circ img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.slot .bd{position:absolute;right:-6px;top:-6px;background:var(--gold);color:#221a00;border-radius:8px;font-size:10px;font-weight:900;padding:0 4px}
.slot .nm{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.slot .rl{font-size:9px;color:#dbeafe;opacity:.9}
.bench{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.bchip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 8px;touch-action:none;cursor:grab;user-select:none;font-size:13px}
.bchip.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,197,66,.5)}
.bchip .o{font-weight:900;color:var(--gold)}
.bchip .x{color:var(--mut);padding:0 3px;cursor:pointer}
.ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%);opacity:.9}
/* team lists */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trow{display:flex;align-items:center;gap:6px;padding:6px 6px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent}
.trow.sel{border-color:var(--gold);background:rgba(245,197,66,.1)}
.trow .r{width:34px;color:var(--mut);font-size:11px;font-weight:700}
.trow .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .o{font-weight:900;color:var(--gold)}
.trow.bn{opacity:.65}
.meter{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
/* score */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.score .t{font-weight:700}
.score .n{font-size:44px;font-weight:900;letter-spacing:2px}
.evgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.evgrid button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 4px;font-size:13px;cursor:pointer}
.evgrid button i{display:block;font-style:normal;font-size:22px}
.ev{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev .m{width:34px;color:var(--mut);font-size:12px}
.bdg{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800}
.bdg.g{background:#2b3512;color:#34d399}.bdg.y{background:#3f3a10;color:#facc15}.bdg.r{background:#3b1519;color:#fca5a5}
input[type=range]{width:100%;accent-color:var(--ac)}
/* modal */
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px 16px 26px}
@media(min-width:760px){#modal{align-items:center}.sheet{border-radius:18px}}
.sl{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.sl b{text-align:right}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;z-index:300;display:none}
/* tema: nero cenere + volt lime */
.btn{border-radius:999px;padding:10px 18px}.btn.sm{border-radius:999px;padding:7px 13px}
.panel,.tile{border-radius:20px}.sheet{border-radius:24px 24px 0 0}
nav{border-top:0;margin:0 10px calc(8px + env(safe-area-inset-bottom));left:0;right:0;border-radius:26px;background:#1a1a1d;border:1px solid var(--line);padding-bottom:0}
nav button{padding:11px 0 9px}
nav button:nth-child(3){position:relative}
nav button:nth-child(3) i{background:var(--ac);color:#12160a;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 6px 18px rgba(209,255,66,.35);font-size:21px}
nav button:nth-child(3).on{color:var(--ac)}
body{padding-bottom:96px}
.rsvp button.on{background:rgba(209,255,66,.14);border-color:var(--ac);color:var(--ac)}
</style>

<body>
<header><h1>MIS<span>TER</span></h1><button class="btn sec sm" data-act="menu">⋮</button></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<script>
'use strict';
/* ===== util ===== */
const $=(s,e=document)=>e.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const ini=n=>(n||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1800)}

/* ===== stato ===== */
const KEY='mister_v1',UIKEY='mister_ui';
const freshUI=()=>({tab:'home',pid:null,rid:null,mid:null,fil:'all',q:''});
const freshSetup=()=>({format:7,A:null,B:null,pool:[]});
const fresh=()=>({players:[],rosters:[],matches:[],events:[],rsvps:[],ratings:[],links:[],pairs:[],live:null,setup:freshSetup(),ui:freshUI()});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=fresh()}
try{S.ui=Object.assign(freshUI(),JSON.parse(localStorage.getItem(UIKEY))||S.ui||{})}catch(e){}
const clone=v=>JSON.parse(JSON.stringify(v));
/* --- normalizzazione: il db può omettere array/oggetti vuoti --- */
const nTeam=t=>t?Object.assign(t,{pids:t.pids||[],played:t.played}):t;
function normSetup(x){x=Object.assign(freshSetup(),x||{});x.pool=x.pool||[];nTeam(x.A);nTeam(x.B);return x}
function normLive(x){if(!x)return null;x.events=x.events||[];x.ratings=x.ratings||{};nTeam(x.A);nTeam(x.B);return x}
const NORM={
 players:p=>{p.roles=p.roles&&p.roles.length?p.roles:['CM'];p.s=p.s||{};p.name=p.name||'';return p},
 rosters:r=>{r.pids=r.pids||[];const l=r.lineup||[];r.lineup=Array.from({length:r.format||7},(_,i)=>l[i]||null);return r},
 matches:m=>{m.events=m.events||[];m.ratings=m.ratings||{};m.evo=m.evo||{};m.ovrs=m.ovrs||{};m.awards=m.awards||{};nTeam(m.A);nTeam(m.B);return m},
 events:e=>e,rsvps:r=>r,links:l=>l,pairs:x=>x,
 ratings:r=>{r.s=r.s||{};r.log=r.log||[];return r}
};
const ALLCOLS=['players','rosters','matches','events','rsvps','ratings','links','pairs'];
let ADM=!window.claude,UID=null,USER=null;
const canWrite=path=>ADM||/^(ratings|rsvps|links)\//.test(path);
S.setup=normSetup(S.setup);S.live=normLive(S.live);
/* --- sync db condiviso --- */
let DB=null,ready=false,inflight=0,pending={},chain=Promise.resolve(),stale=false;
const shadow=new Map();
const stab=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(q=>[q,x[q]])):x);
function docsOf(){const m=new Map();S.players.forEach(p=>m.set('players/'+p.id,p));S.rosters.forEach(r=>m.set('rosters/'+r.id,r));S.matches.forEach(x=>m.set('matches/'+x.id,x));['events','rsvps','ratings','links','pairs'].forEach(c=>S[c].forEach(x=>m.set(c+'/'+x.id,x)));m.set('state/setup',{data:S.setup});m.set('state/live',{data:S.live});return m}
function enqueue(fn){inflight++;chain=chain.then(fn).catch(e=>{toast(e&&e.code==='invalid_argument'?'Sola lettura: non puoi modificare':'Errore di sincronizzazione')}).finally(()=>{inflight--;if(!inflight){const p=Object.values(pending);pending={};p.forEach(f=>f())}})}
function save(){
 try{localStorage.setItem(UIKEY,JSON.stringify(S.ui))}catch(e){}
 if(!DB){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Memoria piena: esporta un backup')}return}
 if(!ready)return;
 const cur=docsOf();
 for(const [path,val] of cur){const j=stab(val);if(shadow.get(path)!==j){shadow.set(path,j);if(canWrite(path))enqueue(()=>DB.doc(path).set(JSON.parse(j)))}}
 for(const path of [...shadow.keys()])if(!cur.has(path)){shadow.delete(path);if(canWrite(path))enqueue(()=>DB.doc(path).delete())}
}
function afterRemote(){
 if($('#modal').classList.contains('on')||DR||(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))){stale=true;return}
 stale=false;render();
}
async function initDB(){
 try{DB=window.claude?await window.claude.use('db'):null}catch(e){DB=null}
 if(!DB){ADM=!window.claude;return}
 try{USER=await window.claude.use('user');if(USER){UID=await USER.id();ADM=!!(USER.canEdit()||USER.isOwner())}else ADM=false}catch(e){ADM=false}
 const legacy=ADM&&S.players.length?JSON.parse(JSON.stringify(S)):null;
 let n=0;const first=()=>{if(++n<ALLCOLS.length+2)return;ready=true;
  if(legacy&&!S.players.length&&!S.rosters.length&&!S.matches.length){S.players=legacy.players;S.rosters=legacy.rosters;S.matches=legacy.matches;save();toast('Dati locali caricati online')}
  render();deepLink()};
 let got={};
 const err=e=>toast('Sync non disponibile'+(e&&e.code?' ('+e.code+')':''));

const GROUPS=[

 {id:'tir',name:'Tiro',stats:[['pos','Piazzamento'],['fin','Finalizzazione'],['pow','Potenza tiro'],['lsh','Tiro da fuori'],['vol','Tiro al volo'],['pen','Rigori']]},
 {id:'pas',name:'Passaggio',stats:[['vis','Visione'],['cro','Cross'],['fk','Punizioni'],['sp','Pass. corto'],['lp','Pass. lungo'],['cur','Effetto']]},
 {id:'drb',name:'Dribbling',stats:[['agi','Agilità'],['bal','Equilibrio'],['rea','Reattività'],['bc','Controllo palla'],['dri','Dribbling'],['com','Freddezza']]},
 {id:'dif',name:'Difesa',stats:[['int','Intercetti'],['hea','Colpo di testa'],['dfa','Senso difensivo'],['stk','Contrasto'],['slk','Scivolata']]},
 {id:'fis',name:'Fisico',stats:[['jum','Salto'],['sta','Resistenza'],['str','Forza'],['agg','Aggressività']]},
 {id:'por',name:'Portiere',stats:[['div','Tuffo'],['han','Presa'],['kic','Rinvio'],['ref','Riflessi'],['gpo','Piazz. portiere']]}
];
const KEYS=[],LBL={};GROUPS.forEach(g=>g.stats.forEach(s=>{KEYS.push(s[0]);LBL[s[0]]=s[1]}));
const GKK=['div','han','kic','ref','gpo'];
const DEF={};KEYS.forEach(k=>DEF[k]=GKK.includes(k)?25:50);
const ROLES=[['GK','Portiere'],['CB','Difensore centrale'],['LB','Terzino sx'],['RB','Terzino dx'],['CDM','Mediano'],['CM','Centrocampista'],['CAM','Trequartista'],['LM','Esterno sx'],['RM','Esterno dx'],['LW','Ala sx'],['RW','Ala dx'],['CF','Seconda punta'],['ST','Attaccante']];
const PROF={GK:'GK',CB:'CB',LB:'FB',RB:'FB',CDM:'CDM',CM:'CM',CAM:'CAM',LM:'WM',RM:'WM',LW:'W',RW:'W',CF:'CF',ST:'ST'};
const FAM={GK:'gk',CB:'def',LB:'def',RB:'def',CDM:'mid',CM:'mid',CAM:'mid',LM:'wide',RM:'wide',LW:'wide',RW:'wide',CF:'att',ST:'att'};
const W={
 GK:{div:.22,han:.22,ref:.25,kic:.10,gpo:.21},
 CB:{dfa:.22,stk:.18,int:.15,hea:.12,slk:.08,str:.10,jum:.05,agg:.05,spr:.05},
 FB:{spr:.10,acc:.07,sta:.15,stk:.12,dfa:.12,int:.10,cro:.10,sp:.08,dri:.06,bc:.05,slk:.05},
 CDM:{dfa:.18,int:.17,stk:.15,sp:.12,lp:.08,sta:.10,str:.08,agg:.06,bc:.06},
 CM:{sp:.20,vis:.15,lp:.10,bc:.12,sta:.12,int:.08,dfa:.05,dri:.06,rea:.06,com:.06},
 CAM:{vis:.15,sp:.15,bc:.15,dri:.15,pos:.08,fin:.08,agi:.08,lsh:.05,rea:.06,com:.05},
 WM:{cro:.14,dri:.14,bc:.12,spr:.10,acc:.10,sta:.10,sp:.10,vis:.06,fin:.05,agi:.05,cur:.04},
 W:{dri:.18,acc:.12,spr:.12,bc:.12,agi:.08,cro:.10,fin:.10,pos:.06,sp:.06,cur:.06},
 CF:{fin:.20,pos:.15,bc:.12,dri:.10,sp:.10,vis:.08,pow:.07,acc:.06,spr:.06,com:.06},
 ST:{fin:.25,pos:.20,pow:.10,hea:.05,bc:.10,dri:.05,acc:.08,spr:.07,com:.05,rea:.05}
};
Object.values(W).forEach(w=>{const t=Object.values(w).reduce((a,b)=>a+b,0);for(const k in w)w[k]/=t});
const sv=(p,k)=>(p._e&&p._e[k]!=null)?p._e[k]:(p.s[k]??DEF[k]);
/* limiti fisici (morbidi) da altezza/peso/età */
function capOf(p,k){
 const h=+p.h||0,w=+p.w||0,a=+p.age||0;if(!h&&!w&&!a)return 99;
 const bmi=(h&&w)?w/((h/100)**2):0,heavy=bmi?Math.max(0,bmi-26):0,light=bmi?Math.max(0,20-bmi):0;
 let c=99;
 if(k==='spr')c-=heavy*3.6+(a>32?(a-32)*1.4:0);
 else if(k==='acc')c-=heavy*3+(a>34?(a-34)*1.2:0);
 else if(k==='agi')c-=heavy*2.6+(a>36?a-36:0);
 else if(k==='bal')c-=heavy*1.2;
 else if(k==='sta')c-=Math.max(0,bmi-27)*3+(a>34?(a-34)*1.3:0);
 else if(k==='jum')c-=heavy*2.2+(h&&h<170?(170-h)*.6:0)+(a>34?a-34:0);
 else if(k==='str')c-=light*5+(w&&w<60?(60-w)*1.2:0);
 else if(k==='hea')c-=(h&&h<180?(180-h)*.7:0);
 return Math.max(25,Math.round(c));
}
const softCap=(v,c)=>v<=c?v:c+(v-c)*.3;
function cappedStats(p){const o={};KEYS.forEach(k=>{o[k]=Math.round(softCap(p.s[k]??DEF[k],capOf(p,k)))});return o}
function setHid(o,k,v){Object.defineProperty(o,k,{value:v,writable:true,configurable:true,enumerable:false})}
/* forma recente: solo fattori oggettivi (voti, gol/assist, risultati, cartellini) sulle ultime 5 partite giocate */
const playedIn=(m,id)=>(m.A.played||m.A.pids).includes(id)?'A':(m.B.played||m.B.pids).includes(id)?'B':null;
function formOf(p){
 const ms=S.matches.filter(m=>playedIn(m,p.id)).sort((a,b)=>b.date-a.date).slice(0,5);
 if(ms.length<2)return 0;
 const rt=[];let ga=0,w=0,y=0,r=0;
 ms.forEach(m=>{const T=playedIn(m,p.id),own=T==='A'?m.sa:m.sb,opp=T==='A'?m.sb:m.sa;
  if(m.ratings&&m.ratings[p.id]!=null)rt.push(m.ratings[p.id]);
  w+=own>opp?1:own===opp?.5:0;
  m.events.forEach(e=>{if(e.pid===p.id){if(e.type==='goal'||e.type==='pen')ga++;if(e.type==='yellow')y++;if(e.type==='red')r++}if(e.ass===p.id)ga++})});
 const n=ms.length,sc=((rt.length?avg(rt):6.3)-6.3)*1.6+Math.min(ga/n,2)*.9+(w/n-.5)*1.2-(y*.3+r*1.5)/n;
 return clamp(Math.round(sc),-5,5);
}
/* statistiche effettive = media tra valore base (admin) e proposte dei compagni, poi limiti fisici */
function computeEff(){
 const by={};S.ratings.forEach(r=>{(by[r.t]=by[r.t]||[]).push(r)});
 S.players.forEach(p=>{const R=by[p.id]||[],e={};
  KEYS.forEach(k=>{const v=[p.s[k]??DEF[k]];R.forEach(r=>{if(r.s&&r.s[k]!=null)v.push(r.s[k])});e[k]=Math.round(softCap(avg(v),capOf(p,k)))});
  setHid(p,'_e',e);setHid(p,'_n',R.length);setHid(p,'_f',formOf(p))});
}
const ovrF=p=>ovr(p)+(p._f||0);
const isGK=p=>p.roles[0]==='GK';
function roleOvr(p,role){const w=W[PROF[role]];let t=0;for(const k in w)t+=sv(p,k)*w[k];return Math.round(t)}
const ovr=p=>roleOvr(p,p.roles[0]);
function slotScore(p,role){
 const b=roleOvr(p,role)+(p._f||0);
 if(p.roles.some(r=>PROF[r]===PROF[role]))return b;
 if(role==='GK'||isGK(p))return b-40;
 return b-(p.roles.some(r=>FAM[r]===FAM[role])?4:12);
}
function face(p){
 const g=k=>sv(p,k),r=x=>Math.round(x);
 if(isGK(p))return[['TUF',g('div')],['PAR',g('han')],['CAL',g('kic')],['RIF',g('ref')],['VEL',r(.5*g('acc')+.5*g('spr'))],['POS',g('gpo')]];
 return[
  ['RIT',r(.45*g('acc')+.55*g('spr'))],
  ['TIR',r(.45*g('fin')+.20*g('pow')+.20*g('pos')+.05*g('lsh')+.05*g('vol')+.05*g('pen'))],
  ['PAS',r(.35*g('sp')+.20*g('vis')+.20*g('lp')+.15*g('cro')+.05*g('cur')+.05*g('fk'))],
  ['DRI',r(.50*g('dri')+.30*g('bc')+.10*g('agi')+.05*g('bal')+.05*g('com'))],
  ['DIF',r(.30*g('int')+.30*g('dfa')+.20*g('stk')+.10*g('slk')+.10*g('hea'))],
  ['FIS',r(.30*g('str')+.30*g('sta')+.20*g('agg')+.20*g('jum'))]];
}
function genStats(role,target){
 const w=W[PROF[role]],s={},gk=role==='GK',tmp={s,roles:[role]};
 KEYS.forEach(k=>{const G=GKK.includes(k),x=w[k]||0;let v;
  if(G)v=gk?target+rnd(-6,6):rnd(12,30);
  else if(gk)v=rnd(25,50);
  else v=target+rnd(-6,6)+(x>=.1?4:x>=.05?0:-14);
  s[k]=clamp(Math.round(v),10,99)});
 const ks=Object.keys(w).sort((a,b)=>w[b]-w[a]);
 for(let i=0;i<300;i++){
  const o=roleOvr(tmp,role),d=target-o;if(!d)break;
  if(Math.abs(d)>=2){const sh=Math.round(d);ks.forEach(k=>s[k]=clamp(s[k]+sh,10,99))}
  else{const dir=d>0?1:-1,k=ks.find((k,j)=>j>=i%ks.length&&s[k]+dir>=10&&s[k]+dir<=99)||ks.find(k=>s[k]+dir>=10&&s[k]+dir<=99);if(!k)break;s[k]+=dir}
 }
 return s;
}
function gval(p,gid){
 const g=GROUPS.find(x=>x.id===gid);
 if(gid==='por')return Math.round(avg(g.stats.map(([k])=>sv(p,k))));
 const i=['rit','tir','pas','drb','dif','fis'].indexOf(gid);
 const gk=isGK(p);
 if(gk)return Math.round(avg(g.stats.map(([k])=>sv(p,k))));
 return face(p)[i][1];
}
const getP=id=>S.players.find(p=>p.id===id);
const vcls=v=>v>=80?'h':v>=60?'m':v>=40?'l':'z';

/* ===== moduli ===== */
const FORM={
 5:{'1-2-1':[['CB'],['LM','RM'],['ST']],'2-2':[['LB','RB'],['ST','ST']],'3-1':[['LB','CB','RB'],['ST']],'1-1-2':[['CB'],['CM'],['ST','ST']]},
 7:{'2-3-1':[['CB','CB'],['LM','CM','RM'],['ST']],'3-2-1':[['LB','CB','RB'],['CM','CM'],['ST']],'2-2-2':[['CB','CB'],['CM','CM'],['ST','ST']],'3-1-2':[['LB','CB','RB'],['CM'],['ST','ST']],'2-3-1 (ali)':[['CB','CB'],['CM','CM','CM'],['ST']]},
 11:{'4-4-2':[['LB','CB','CB','RB'],['LM','CM','CM','RM'],['ST','ST']],'4-3-3':[['LB','CB','CB','RB'],['CM','CDM','CM'],['LW','ST','RW']],'4-2-3-1':[['LB','CB','CB','RB'],['CDM','CDM'],['LM','CAM','RM'],['ST']],'3-5-2':[['CB','CB','CB'],['LM','CM','CDM','CM','RM'],['ST','ST']],'3-4-3':[['CB','CB','CB'],['LM','CM','CM','RM'],['LW','ST','RW']],'4-5-1':[['LB','CB','CB','RB'],['LM','CM','CAM','CM','RM'],['ST']],'5-3-2':[['LB','CB','CB','CB','RB'],['CM','CM','CM'],['ST','ST']],'4-1-4-1':[['LB','CB','CB','RB'],['CDM'],['LM','CM','CM','RM'],['ST']]}
};
const DEFF={5:'1-2-1',7:'2-3-1',11:'4-4-2'};
function slotsOf(fm,name){
 const rows=FORM[fm][name]||FORM[fm][DEFF[fm]],R=rows.length,out=[{role:'GK',x:50,y:91}];
 rows.forEach((row,i)=>{const y=R===1?45:72-i*(58/(R-1));row.forEach((role,j)=>out.push({role,x:(j+1)/(row.length+1)*100,y}))});
 return out;
}
function assign(pids,slots){
 const P=pids.map(getP).filter(Boolean),n=slots.length,used=new Set(),res=Array(n).fill(null);
 const order=slots.map((s,i)=>i).sort((a,b)=>(slots[a].role==='GK'?-1:0)-(slots[b].role==='GK'?-1:0));
 for(const i of order){let best=null,bs=-1e9;for(const p of P){if(used.has(p.id))continue;const sc=slotScore(p,slots[i].role);if(sc>bs){bs=sc;best=p}}if(best){res[i]=best.id;used.add(best.id)}}
 let imp=true,g=0;
 while(imp&&g++<25){imp=false;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(!res[i]||!res[j])continue;const a=getP(res[i]),b=getP(res[j]);
   if(slotScore(b,slots[i].role)+slotScore(a,slots[j].role)>slotScore(a,slots[i].role)+slotScore(b,slots[j].role)+.01){[res[i],res[j]]=[res[j],res[i]];imp=true}}
  for(let i=0;i<n;i++){if(!res[i])continue;const cur=getP(res[i]);for(const p of P){if(used.has(p.id))continue;
   if(slotScore(p,slots[i].role)>slotScore(cur,slots[i].role)+.01){used.delete(cur.id);used.add(p.id);res[i]=p.id;imp=true;break}}}
 }
 return res;
}
function lineRating(lineup,slots){const v=lineup.map((id,i)=>id?slotScore(getP(id),slots[i].role):null).filter(x=>x!=null);return v.length?avg(v):0}

/* ===== bilanciamento ===== */
function balance(pids){
 const V=pids.map(getP).map(p=>({id:p.id,o:ovrF(p),gk:isGK(p),fam:FAM[p.roles[0]],f:isGK(p)?[0,0,0,0,0,0]:face(p).map(x=>x[1])}));
 const n=V.length,nA=Math.ceil(n/2),totGK=V.filter(v=>v.gk).length,PR=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const r=relOf(V[i].id,V[j].id);if(r)PR.push([i,j,r])}
 const cost=m=>{
  const o=[0,0],f=[Array(6).fill(0),Array(6).fill(0)],gk=[0,0],fam=[{},{}];
  V.forEach((v,i)=>{const t=m[i];o[t]+=v.o;v.f.forEach((x,k)=>f[t][k]+=x);if(v.gk)gk[t]++;fam[t][v.fam]=(fam[t][v.fam]||0)+1});
  let c=2*Math.abs(o[0]-o[1]);
  for(let k=0;k<6;k++)c+=.4*Math.abs(f[0][k]-f[1][k]);
  ['def','mid','wide','att'].forEach(k=>c+=5*Math.abs((fam[0][k]||0)-(fam[1][k]||0)));
  PR.forEach(([i,j,r])=>{if(m[i]===m[j])c+=r==='rival'?60:-10});
  const dg=Math.abs(gk[0]-gk[1]);if(dg>totGK%2)c+=40*(dg-totGK%2);
  return c};
 const res=[];
 for(let r=0;r<30;r++){
  const idx=V.map((_,i)=>i).sort(()=>Math.random()-.5),m=Array(n).fill(1);idx.slice(0,nA).forEach(i=>m[i]=0);
  let c=cost(m),imp=true;
  while(imp){imp=false;let bi=-1,bj=-1,bc=c;
   for(let i=0;i<n;i++)if(m[i]===0)for(let j=0;j<n;j++)if(m[j]===1){m[i]=1;m[j]=0;const cc=cost(m);m[i]=0;m[j]=1;if(cc<bc-1e-6){bc=cc;bi=i;bj=j}}
   if(bi>=0){m[bi]=1;m[bj]=0;c=bc;imp=true}}
  res.push({m:m.slice(),c});
 }
 res.sort((a,b)=>a.c-b.c);
 const lim=res[0].c*1.15+2,pool=res.filter(x=>x.c<=lim),pick=pool[rnd(0,pool.length-1)];
 let A=V.filter((_,i)=>pick.m[i]===0).map(v=>v.id),B=V.filter((_,i)=>pick.m[i]===1).map(v=>v.id);
 if(Math.random()<.5)[A,B]=[B,A];
 return[A,B];
}

function refineBalance(A,B,fm){
 const f=DEFF[fm],str=ids=>{const sl=slotsOf(fm,f);return lineRating(assign(ids,sl),sl)};
 const obj=(a,b)=>Math.abs(str(a)-str(b))+pairPen(a)+pairPen(b);
 let A2=A.slice(),B2=B.slice(),d=obj(A2,B2);
 for(let pass=0;pass<3&&d>.4;pass++){let best=null;
  for(let i=0;i<A2.length;i++)for(let j=0;j<B2.length;j++){
   const a=A2.slice(),b=B2.slice();[a[i],b[j]]=[b[j],a[i]];const nd=obj(a,b);
   if(nd<d-.05&&(!best||nd<best.d))best={a,b,d:nd}}
  if(!best)break;A2=best.a;B2=best.b;d=best.d}
 return[A2,B2];
}
/* ===== risultati / stats derivate ===== */
function scoreOf(ev){let a=0,b=0;ev.forEach(e=>{if(e.type==='goal'||e.type==='pen'){e.team==='A'?a++:b++}else if(e.type==='og'){e.team==='A'?b++:a++}});return[a,b]}
function pstats(id){
 const r={app:0,g:0,a:0,y:0,r:0,ps:0,pm:0,mv:0,w:0,d:0,l:0,cs:0,gc:0,og:0,rt:[]};
 S.matches.forEach(m=>{
  ['A','B'].forEach(T=>{if(!(m[T].played||m[T].pids).includes(id))return;r.app++;
   const own=T==='A'?m.sa:m.sb,opp=T==='A'?m.sb:m.sa;own>opp?r.w++:own===opp?r.d++:r.l++;
   if(m.gk&&m.gk[T]===id){r.gc+=opp;if(!opp)r.cs++}});
  m.events.forEach(e=>{
   if(e.ass===id)r.a++;
   if(e.pid!==id)return;
   if(e.type==='goal'||e.type==='pen')r.g++;
   if(e.type==='pen')r.ps++;if(e.type==='penmiss')r.pm++;if(e.type==='yellow')r.y++;if(e.type==='red')r.r++;if(e.type==='og')r.og++});
  if(m.ratings&&m.ratings[id]!=null)r.rt.push(m.ratings[id]);
  if(m.motm===id)r.mv++;
 });
 r.avg=r.rt.length?avg(r.rt):null;return r;
}

function radar(f){
 const c=100,R=68,n=6,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[c+r*Math.cos(a),c+r*Math.sin(a)]};
 const poly=k=>Array.from({length:n},(_,i)=>pt(i,R*k).join(',')).join(' ');
 const data=f.map((x,i)=>pt(i,R*x[1]/99).join(',')).join(' ');
 return`<svg viewBox="0 0 200 200" width="100%">${[1,.66,.33].map(k=>`<polygon points="${poly(k)}" fill="none" stroke="#35353b" stroke-width="1"/>`).join('')}${f.map((_,i)=>`<line x1="${c}" y1="${c}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="#35353b"/>`).join('')}<polygon points="${data}" fill="rgba(209,255,66,.35)" stroke="#d1ff42" stroke-width="2"/>${f.map((x,i)=>{const[a,b]=pt(i,R+17);return`<text x="${a}" y="${b}" fill="#f2f4f7" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">${x[0]} ${x[1]}</text>`}).join('')}</svg>`;
}

function dropSlot(pid,idx){const r=curR(),L=r.lineup,cur=L.indexOf(pid),tg=L[idx];if(cur===idx)return;if(cur>=0)L[cur]=tg||null;L[idx]=pid;SEL=null;save();render()}
function toBench(pid){const r=curR(),i=r.lineup.indexOf(pid);if(i>=0)r.lineup[i]=null;SEL=null;save();render()}
/* drag & tap */
let DR=null;
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-drag]');if(!el||e.target.closest('.x'))return;
 DR={pid:el.dataset.drag,from:el.dataset.from,slot:el.dataset.slot,x:e.clientX,y:e.clientY,moved:false,el,ghost:null};
});
document.addEventListener('pointermove',e=>{
 if(!DR)return;
 if(!DR.moved&&Math.hypot(e.clientX-DR.x,e.clientY-DR.y)>8){DR.moved=true;const g=DR.el.cloneNode(true);g.classList.add('ghost');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';document.body.appendChild(g);DR.ghost=g}
 if(DR.moved){DR.ghost.style.left=e.clientX+'px';DR.ghost.style.top=e.clientY+'px';e.preventDefault()}
});
document.addEventListener('pointerup',e=>{
 if(!DR)return;const d=DR;DR=null;
 if(d.moved){d.ghost.remove();const t=document.elementFromPoint(e.clientX,e.clientY),sl=t&&t.closest('[data-slot]'),bn=t&&t.closest('[data-bench]');
  if(sl)dropSlot(d.pid,+sl.dataset.slot);else if(bn)toBench(d.pid);return}
 const r=curR();if(!r)return;
 if(SEL&&SEL!==d.pid){
  if(d.from==='slot'){dropSlot(SEL,+d.slot);return}
  const si=r.lineup.indexOf(SEL);if(si>=0){dropSlot(d.pid,si);return}
 }
 SEL=SEL===d.pid?null:d.pid;render();
});
document.addEventListener('pointercancel',()=>{if(DR&&DR.ghost)DR.ghost.remove();DR=null});

function suggestRating(L,id,T){

 L.events.forEach(e=>{if(e.pid===id){if(e.type==='goal'||e.type==='pen')r+=.6;if(e.type==='penmiss')r-=.3;if(e.type==='yellow')r-=.3;if(e.type==='red')r-=1.2;if(e.type==='og')r-=.8}if(e.ass===id)r+=.4});
 return clamp(Math.round(r*2)/2,3,10);
}

/* storico overall partita per partita */
function ovrChart(p){
 const ms=S.matches.slice().sort((a,b)=>a.date-b.date).filter(m=>m.ovrs&&m.ovrs[p.id]!=null);
 const pts=ms.map((m,i)=>({v:m.ovrs[p.id],pl:!!playedIn(m,p.id),t:`Partita ${i+1}: ${m.ovrs[p.id]}${playedIn(m,p.id)?'':' (assente)'}`}));
 pts.push({v:ovr(p),pl:false,now:true,t:'Ora: '+ovr(p)});
 if(pts.length<2)return'<div class="mut small">Lo storico si costruisce partita dopo partita: ora '+ovr(p)+'.</div>';
 const W=340,H=170,L=28,R=12,T=14,B=26,vs=pts.map(x=>x.v);
 let lo=Math.floor(Math.min(...vs)-2),hi=Math.ceil(Math.max(...vs)+2);if(hi-lo<6){lo-=2;hi+=2}
 const X=i=>L+(W-L-R)*i/(pts.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 const step=Math.max(1,Math.ceil((hi-lo)/4)),grid=[];for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)grid.push(v);
 const every=Math.ceil(pts.length/8);
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Storico overall">
 ${grid.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#35353b" stroke-width="1"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#9096a0">${v}</text>`).join('')}
 <polyline fill="none" stroke="#d1ff42" stroke-width="2" stroke-linejoin="round" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>
 ${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="${x.now?4.5:3.5}" fill="${x.pl||x.now?'#d1ff42':'#0e0e10'}" stroke="#d1ff42" stroke-width="1.6"><title>${esc(x.t)}</title></circle>${i%every===0||x.now?`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="9" fill="#9096a0">${x.now?'ora':i+1}</text>`:''}`).join('')}
 </svg><div class="small mut" style="margin-top:4px">● giocata · ○ assente (overall stabile) · asse x: partite</div>`;
}

/* chimica di coppia */
const pairId=(a,b)=>[a,b].sort().join('_');
const relOf=(a,b)=>{const r=S.pairs.find(x=>x.id===pairId(a,b));return r?r.rel:null};
function pairStats(id){
 const o={};S.matches.forEach(m=>{const T=playedIn(m,id);if(!T)return;const own=T==='A'?m.sa:m.sb,opp=T==='A'?m.sb:m.sa,res=own>opp?1:own===opp?.5:0;
  (m[T].played||m[T].pids).forEach(q=>{if(q===id||!getP(q))return;const x=o[q]=o[q]||{n:0,w:0,d:0,l:0,pts:0};x.n++;x.pts+=res;res===1?x.w++:res===.5?x.d++:x.l++})});
 return o;
}
function chemHTML(p){
 const ps=pairStats(p.id),rows=Object.entries(ps).filter(([q,x])=>x.n>=2).map(([q,x])=>({q,...x,r:x.pts/x.n})).sort((a,b)=>b.r-a.r);
 const rel=S.pairs.filter(r=>r.a===p.id||r.b===p.id).map(r=>({q:r.a===p.id?r.b:r.a,rel:r.rel})).filter(r=>getP(r.q));
 const line=x=>`<div class="row sp small" style="padding:3px 0"><span>${esc(nm(x.q))}</span><span class="mut">${x.w}V ${x.d}N ${x.l}P · <b style="color:${x.r>=.6?'#34d399':x.r<=.4?'#f87171':'var(--tx)'}">${Math.round(x.r*100)}%</b></span></div>`;
 return`<div class="panel">
 ${rel.length?`<div class="row wrap" style="margin-bottom:8px">${rel.map(r=>`<span class="chip" style="${r.rel==='friend'?'border-color:#34d399;color:#34d399':'border-color:#f87171;color:#fca5a5'}">${r.rel==='friend'?'🤝':'⚔️'} ${esc(nm(r.q))}</span>`).join('')}</div>`:''}
 ${rows.length?`<div class="small mut" style="font-weight:700;margin-bottom:2px">RENDIMENTO IN COPPIA (min. 2 partite)</div>${rows.slice(0,3).map(line).join('')}${rows.length>3?`<div class="small mut" style="margin:6px 0 2px">Peggiori</div>${rows.slice(-2).reverse().map(line).join('')}`:''}`:'<div class="mut small">Servono almeno 2 partite insieme per calcolare la chimica.</div>'}
 ${ADM?`<div class="row" style="margin-top:8px"><button class="btn sec sm" data-act="relNew" data-id="${p.id}">Imposta relazione</button></div>`:''}</div>`;
}
function pairPen(ids){let c=0;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const r=relOf(ids[i],ids[j]);if(r==='rival')c+=3;else if(r==='friend')c-=.6}return c}

function whenLbl(iso){

 const evs=S.events.filter(e=>e.status!=='closed'&&new Date(e.when).getTime()>=now).sort((a,b)=>a.when.localeCompare(b.when));
 const pend=me?evs.filter(e=>!rsvpOf(e.id,me)):[];
 if(!p){

function viewEvents(){

  ${me?`<div class="rsvp">${RV.map(([k,i,l])=>`<button class="${mine===k?'on '+k:''}" data-act="rsvp" data-e="${e.id}" data-v="${k}">${i} ${l}</button>`).join('')}</div>`:''}

 claimSkip:()=>{try{localStorage.setItem('mister_noclaim','1')}catch(e){}closeModal()},
 unlink:d=>{S.links=S.links.filter(l=>l.id!==d.id);save();render()},
 /* valutazioni */
 rateP:d=>{if(!myPid()){claimModal();return}rateModal(d.id)},
 rateSave:()=>{const me=myPid();if(!RT||!me)return;const ks=Object.keys(RT.touched);if(!ks.length){toast('Nessuna modifica');return}
  const id=RT.t+'_'+me;let r=S.ratings.find(x=>x.id===id);if(!r){r={id,t:RT.t,r:me,s:{},log:[]};S.ratings.push(r)}
  const ch={};ks.forEach(k=>{r.s[k]=RT.touched[k];ch[k]=RT.touched[k]});r.log=(r.log||[]).concat([{at:Date.now(),s:ch}]).slice(-15);r.at=Date.now();
  RT=null;save();closeModal();render();toast('Valutazione inviata')},
 /* chimica */
 relNew:d=>{const others=S.players.filter(p=>p.id!==d.id).sort((a,b)=>a.name.localeCompare(b.name));RL={a:d.id,b:null};
  openModal(`<h2>Relazione · ${esc(nm(d.id))}</h2><label>Con</label><div class="row wrap">${others.map(p=>{const r=relOf(d.id,p.id);return`<span class="chip" data-act="relPick" data-id="${p.id}">${esc(p.name)}${r==='friend'?' 🤝':r==='rival'?' ⚔️':''}</span>`}).join('')}</div><div id="relBtns"></div><div class="row" style="margin-top:16px"><button class="btn sec grow" data-act="closeM">Chiudi</button></div>`)},
 relPick:d=>{RL.b=d.id;document.querySelectorAll('[data-act=relPick]').forEach(c=>c.classList.toggle('on',c.dataset.id===d.id));
  $('#relBtns').innerHTML=`<div class="row" style="margin-top:12px"><button class="btn grow" data-act="relSet" data-r="friend">🤝 Affiatati</button><button class="btn dan grow" data-act="relSet" data-r="rival">⚔️ Incompatibili</button><button class="btn sec" data-act="relSet" data-r="">Neutra</button></div>`},
 relSet:d=>{if(!RL||!RL.b)return;const id=pairId(RL.a,RL.b);S.pairs=S.pairs.filter(x=>x.id!==id);if(d.r){const [a,b]=[RL.a,RL.b].sort();S.pairs.push({id,a,b,rel:d.r})}save();closeModal();render()},
 /* condivisione */
 copyT:async()=>{const t=SHARE;try{await navigator.clipboard.writeText(t);toast('Copiato')}catch(e){const a=$('#shT');if(a){a.select();try{document.execCommand('copy');toast('Copiato')}catch(x){toast('Seleziona e copia il testo')}}}},
 shareTeams:()=>{const su=S.setup;if(!(su.A&&su.B))return;shareModal('Condividi squadre',teamsText(su,su.format))},
 shareMatch:d=>{const m=S.matches.find(x=>x.id===d.id);if(m)shareModal('Condividi risultato',matchText(m))},
 /* partite proposte */
 evNew:()=>{const d=new Date(Date.now()+864e5),iso=d.toISOString().slice(0,10);
  openModal(`<h2>Proponi una partita</h2><div class="row"><div class="grow"><label>Data</label><input type="date" id="evD" value="${iso}"></div><div class="grow"><label>Ora</label><input type="time" id="evT" value="21:00"></div></div>
  <label>Formato</label><div class="row">${[5,7,11].map(n=>`<span class="chip ${n===7?'on':''}" data-act="evFmt" data-n="${n}" style="flex:1;justify-content:center;padding:9px">${n} vs ${n}</span>`).join('')}</div><input type="hidden" id="evF" value="7">
  <label>Campo / luogo</label><input type="text" id="evP" placeholder="Es. Campo comunale">
  <label>Note</label><input type="text" id="evN" placeholder="Es. porta la maglia scura">
  <div class="row" style="margin-top:16px"><button class="btn grow" data-act="evSave">Proponi e condividi</button><button class="btn sec" data-act="closeM">Annulla</button></div>`)},
 evFmt:d=>{$('#evF').value=d.n;document.querySelectorAll('[data-act=evFmt]').forEach(c=>c.classList.toggle('on',c.dataset.n===d.n))},
 evSave:()=>{const dd=$('#evD').value,tt=$('#evT').value;if(!dd||!tt){toast('Inserisci data e ora');return}
  const e={id:uid(),when:dd+'T'+tt,format:+$('#evF').value,place:$('#evP').value.trim(),note:$('#evN').value.trim(),status:'open',at:Date.now()};
  S.events.push(e);const mp=myPid();if(mp)setRsvp(e.id,mp,'y');else save();closeModal();render();pushNotify(e);shareModal('Invita il gruppo',inviteText(e))},
 evShare:d=>{const e=S.events.find(x=>x.id===d.e);if(e)shareModal('Invito partita',inviteText(e))},
 rsvp:d=>{const pid=d.p||myPid();if(!pid)return;setRsvp(d.e,pid,d.v);render()},
 evManage:d=>{const e=S.events.find(x=>x.id===d.e);if(!e)return;EM=e.id;
  openModal(`<h2>Risposte · ${fdate(e.when)}</h2>${S.players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{const v=rsvpOf(e.id,p.id);return`<div class="row sp" style="padding:4px 0"><span>${esc(p.name)}${S.links.some(l=>l.p===p.id)?'':' <span class="tag">no account</span>'}</span><span class="row">${RV.map(([k,i])=>`<span class="chip ${v===k?'on':''}" data-act="evSet" data-p="${p.id}" data-v="${k}">${i}</span>`).join('')}</span></div>`}).join('')}<div class="row" style="margin-top:14px"><button class="btn grow" data-act="closeM">Fatto</button></div>`)},
 evSet:d=>{setRsvp(EM,d.p,d.v);const y=$('.sheet').scrollTop;A.evManage({e:EM});$('.sheet').scrollTop=y},
 evUse:d=>{const e=S.events.find(x=>x.id===d.e);if(!e)return;const c=confirmed(e.id);S.setup={format:e.format,A:null,B:null,pool:c};save();render();toast(c.length+' convocati caricati')},
 eventDel:d=>ASK('Eliminare la partita proposta?',()=>{S.events=S.events.filter(x=>x.id!==d.e);S.rsvps=S.rsvps.filter(r=>r.e!==d.e);save();render()}),
 /* menu */
 menu:()=>openModal(`<h2>Menu</h2>${UID?`<div class="row" style="margin-bottom:12px"><button class="btn sec grow" data-act="claim">👤 Il mio profilo${myPid()?': '+esc(nm(myPid())):''}</button></div>`:''}
  <div class="row wrap" style="margin-bottom:12px"><button class="btn sec grow" data-act="notif">🔔 Attiva notifiche</button></div>
  ${ADM?`<h3>Inviti</h3><div class="row wrap" style="margin-bottom:12px"><button class="btn grow" data-act="invNew">➕ Invita giocatore</button><button class="btn sec" data-act="invAdm">Invito admin</button></div><h3>Dati</h3><div class="row wrap"><button class="btn sec" data-act="exp">⬇ Esporta backup</button><button class="btn sec" data-act="imp">⬆ Importa backup</button></div><input type="file" id="impF" accept=".json" style="display:none"><div class="row" style="margin-top:14px"><button class="btn dan" data-act="reset">Cancella tutto</button></div>`:''}
  <div class="row" style="margin-top:14px"><button class="btn sec" data-act="logout">Esci</button><button class="btn sec grow" data-act="closeM">Chiudi</button></div>`),
 exp:async()=>{const data=JSON.stringify(S);let d=null;try{d=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(d){try{await d.save({filename:'mister-backup.json',data})}catch(e){toast('Download annullato')}return}
  const b=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mister-backup.json';a.click()},
 imp:()=>{const f=$('#impF');f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const ui=S.ui;S=Object.assign(fresh(),JSON.parse(r.result));S.ui=ui;save();closeModal();render();toast('Importato')}catch(e){toast('File non valido')}};r.readAsText(f.files[0])};f.click()},
 reset:()=>ASK('Cancellare tutti i dati (su tutti i dispositivi)?',()=>{const ui=S.ui;S=fresh();S.ui=ui;save();closeModal();render()}),
 cfYes:()=>{const f=CFN;CFN=null;closeModal();f&&f()},
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const fn=A[t.dataset.act];if(fn){e.stopPropagation();fn(Object.assign({el:t},t.dataset),e)}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='edFile'&&t.files[0]){resizeImg(t.files[0],u=>{ED.photo=u;$('#edPh').innerHTML=`<img src="${u}">`});return}
 if(t.id==='edPri'){edSync();return}
 if(t.dataset.rt&&S.live){S.live.ratings[t.dataset.rt]=+t.value;save();return}
 if(t.dataset.aw&&S.live){(S.live.awards=S.live.awards||{})[t.dataset.aw]=t.value;save();return}
 const c=t.dataset.ch;if(!c)return;const su=S.setup;
 if(c==='rform'){const r=curR();r.formation=t.value;r.lineup=assign(r.lineup.filter(Boolean),slotsOf(r.format,t.value));save();render()}
 else if(c==='tform'){su[t.dataset.t].formation=t.value;save();render()}
 else if(c==='tname'){su[t.dataset.t].name=t.value||'Squadra';save()}
 else if(c==='tload'&&t.value){const r=S.rosters.find(x=>x.id===t.value);su[t.dataset.t].pids=r.pids.slice();su[t.dataset.t].formation=r.formation;SEL2=null;save();render()}
 else if(c==='poolR'&&t.value){const r=S.rosters.find(x=>x.id===t.value);su.pool=r.pids.filter(id=>getP(id));save();render()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){S.ui.q=t.value;const pos=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);return}
 if(t.dataset.s&&ED){ED.s[t.dataset.s]=+t.value;$('#sv_'+t.dataset.s).textContent=t.value;edSync();GROUPS.forEach(g=>{const e=$('#gv_'+g.id),v=gval({s:cappedStats(ED),roles:ED.roles},g.id);if(e){e.textContent=v;e.className='gv v '+vcls(v)}});return}
 if(t.dataset.rt&&S.live){S.live.ratings[t.dataset.rt]=+t.value;$('#rt_'+t.dataset.rt).textContent=t.value}
 if(t.dataset.rs&&RT){RT.touched[t.dataset.rs]=+t.value;$('#rv_'+t.dataset.rs).textContent=t.value}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('focusout',()=>setTimeout(()=>{if(stale)afterRemote()},50));
render();
initDB();
</script>
</body>
</html>
