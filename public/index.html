<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0e0e10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MISTER">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MISTER – Gestionale squadre</title>
<style>
:root{--bg:#0e0e10;--bg2:#151517;--card:#1c1c1f;--line:#2b2b30;--tx:#f2f4f7;--mut:#9096a0;--ac:#d1ff42;--ac2:#c7d1dd;--gold:#f5c542;--red:#ef4444;--yel:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
header h1{margin:0;font-size:18px;letter-spacing:2px;font-weight:800}
header h1 span{color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#121214;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--ac)}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:18px 0 8px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.grow{flex:1}
.wrap{flex-wrap:wrap}
button,select,input[type=text],input[type=number]{font:inherit}
.btn{background:var(--ac);color:#12160a;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.dan{background:#3b1519;color:#fca5a5;border:1px solid #6b1f26}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.blk{width:100%}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--tx);cursor:pointer;user-select:none}
.chip.on{background:var(--ac);color:#12160a;border-color:var(--ac);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.mut{color:var(--mut)}
.small{font-size:12px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(5,1fr);gap:12px 10px}}

/* card v2*/
.cardw{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#czoom{position:fixed;inset:0;z-index:140;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transition:opacity .18s}
#czoom.on{opacity:1}
#czoom .cardw{width:min(84vw,calc(78vh*.773),420px);transform:scale(.88);transition:transform .2s cubic-bezier(.2,.9,.3,1.2);filter:drop-shadow(0 20px 40px rgba(0,0,0,.7));pointer-events:none}
#czoom.on .cardw{transform:scale(1)}
/* — sagoma a scudo */
.cardw{filter:drop-shadow(0 12px 18px rgba(0,0,0,.55));cursor:pointer;transition:transform .2s}
.cardw:active{transform:scale(.98)}
.card{--g1:#a07400;--g2:#fbbf00;--l1:#fcd97d;--l2:#fff4d6;--fd1:#ffffff;--fd2:#fff6dc;--bd2:#c8901a;--on:#000;--sh:rgba(0,0,0,.45);container-type:inline-size;position:relative;aspect-ratio:1545/1999;color:#000;overflow:hidden;clip-path:polygon(0.00% 2.20%,0.05% 1.77%,0.22% 1.36%,0.48% 0.98%,0.83% 0.64%,1.27% 0.37%,1.76% 0.17%,2.29% 0.04%,2.85% 0.00%,97.15% 0.00%,97.71% 0.04%,98.24% 0.17%,98.73% 0.37%,99.17% 0.64%,99.52% 0.98%,99.78% 1.36%,99.95% 1.77%,100.00% 2.20%,100.00% 84.14%,99.97% 84.47%,99.87% 84.79%,99.72% 85.09%,99.50% 85.38%,99.24% 85.64%,98.92% 85.86%,98.57% 86.05%,98.18% 86.19%,50.70% 100.44%,50.53% 100.48%,50.36% 100.52%,50.18% 100.53%,50.00% 100.54%,49.82% 100.53%,49.64% 100.52%,49.47% 100.48%,49.30% 100.44%,1.82% 86.19%,1.43% 86.05%,1.08% 85.86%,0.76% 85.64%,0.50% 85.38%,0.28% 85.09%,0.13% 84.79%,0.03% 84.47%,0.00% 84.14%);background:linear-gradient(100deg,#000 0%,#000 18%,var(--bd2) 100%);font-family:'Anton','Impact','Haettenschweiler','Arial Narrow',sans-serif;font-weight:400;letter-spacing:.02em}
.card .c-in{position:absolute;inset:.6cqw;clip-path:polygon(0.00% 2.20%,0.05% 1.77%,0.22% 1.36%,0.48% 0.98%,0.83% 0.64%,1.27% 0.37%,1.76% 0.17%,2.29% 0.04%,2.85% 0.00%,97.15% 0.00%,97.71% 0.04%,98.24% 0.17%,98.73% 0.37%,99.17% 0.64%,99.52% 0.98%,99.78% 1.36%,99.95% 1.77%,100.00% 2.20%,100.00% 84.14%,99.97% 84.47%,99.87% 84.79%,99.72% 85.09%,99.50% 85.38%,99.24% 85.64%,98.92% 85.86%,98.57% 86.05%,98.18% 86.19%,50.70% 100.44%,50.53% 100.48%,50.36% 100.52%,50.18% 100.53%,50.00% 100.54%,49.82% 100.53%,49.64% 100.52%,49.47% 100.48%,49.30% 100.44%,1.82% 86.19%,1.43% 86.05%,1.08% 85.86%,0.76% 85.64%,0.50% 85.38%,0.28% 85.09%,0.13% 84.79%,0.03% 84.47%,0.00% 84.14%);background:radial-gradient(120% 70% at 30% 18%,var(--fd1) 0%,var(--fd2) 100%)}
.card .c-in:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);opacity:.45;pointer-events:none}
.card.t1{--g1:#7a4a22;--g2:#e0a374;--l1:#f0c9a3;--l2:#fbeee0;--fd2:#fbe9d8;--bd2:#b8763f}
.card.t2{--g1:#5f6a7b;--g2:#d3dae6;--l1:#e3e8f1;--l2:#fafbfd;--fd2:#e9edf5;--bd2:#9aa5b8}
.card.t4{--g1:#142f78;--g2:#5fa2f8;--l1:#b9d4ff;--l2:#eef5ff;--fd2:#d9e8ff;--bd2:#3b82f6;--on:#fff}
.card.t5{--g1:#6f7480;--g2:#f4f4f6;--l1:#e8e8ee;--l2:#ffffff;--fd2:#ececf2;--bd2:#c9cbd4}
.card.t5 .c-in:after{background:linear-gradient(115deg,rgba(255,80,160,.18),rgba(80,200,255,.22) 35%,rgba(255,230,90,.2) 55%,rgba(120,255,160,.18) 80%);opacity:1}
.card .shw{position:absolute;filter:drop-shadow(0 1.6cqw 2.4cqw var(--sh));z-index:4}
.card .shp{position:absolute;inset:0;background:#000}
.card .shp>u{position:absolute;inset:.55cqw;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--on);text-align:center;line-height:1}
.card .gold .shp>u{background:linear-gradient(180deg,var(--g1),var(--g2))}
.card .lite .shp>u{color:#000;background:linear-gradient(180deg,var(--l1),var(--l2))}
.c-ovrb{left:4.2cqw;top:2.5cqw;width:17.5cqw;height:18.4cqw}
.c-ovrb .shp,.c-ovrb .shp>u{clip-path:polygon(0.00% 11.96%,3.25% 11.55%,6.29% 10.35%,8.89% 8.45%,10.89% 5.98%,12.14% 3.09%,12.57% 0.00%,87.43% 0.00%,87.86% 3.09%,89.11% 5.98%,91.11% 8.45%,93.71% 10.35%,96.75% 11.55%,100.00% 11.96%,100.00% 88.04%,96.75% 88.45%,93.71% 89.65%,91.11% 91.55%,89.11% 94.02%,87.86% 96.91%,87.43% 100.00%,12.57% 100.00%,12.14% 96.91%,10.89% 94.02%,8.89% 91.55%,6.29% 89.65%,3.25% 88.45%,-0.00% 88.04%)}
.c-ovrb .shp>u{font-size:14.2cqw;padding-top:.6cqw}
.c-fr{position:absolute;left:13cqw;top:11.7cqw;width:73.9cqw;height:74.3cqw;border:.2cqw solid #000;z-index:1;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(0,0,0,.05))}
.c-fr .c-ph{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.c-ph img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.c-ph span{font-size:30cqw;opacity:.18;align-self:center}
.c-rg{position:absolute;left:78.8cqw;top:11.8cqw;width:16.5cqw;z-index:4}
.c-rg .shw{position:relative;display:block;width:16.5cqw;height:11.4cqw;margin-bottom:.4cqw}
.c-rg .shp,.c-rg .shp>u{clip-path:polygon(0 5%,50% 0,100% 5%,100% 95%,50% 100%,0 95%)}
.c-rg .shp>u{font-size:6.6cqw}
.c-nameb{left:28.6cqw;top:80.3cqw;width:55.4cqw;height:11.7cqw}
.c-nameb .shp,.c-nameb .shp>u{clip-path:polygon(0 7%,50% 0,100% 7%,100% 93%,50% 100%,0 93%)}
.c-nameb .shp>u{font-size:7.4cqw;text-transform:uppercase;white-space:nowrap;padding:0 2cqw;letter-spacing:.06em}
.c-nameb.nn{left:16cqw;width:68cqw}
.c-nameb.s2 .shp>u{font-size:6.2cqw}.c-nameb.s3 .shp>u{font-size:5.1cqw}
.c-numb{left:16cqw;top:80.4cqw;width:11.2cqw;height:11.6cqw}
.c-numb .shp,.c-numb .shp>u{clip-path:polygon(0.00% 13.79%,3.70% 13.32%,7.14% 11.95%,10.10% 9.75%,12.37% 6.90%,13.80% 3.57%,14.29% 0.00%,85.71% 0.00%,86.20% 3.57%,87.63% 6.90%,89.90% 9.75%,92.86% 11.95%,96.30% 13.32%,100.00% 13.79%,100.00% 86.21%,96.30% 86.68%,92.86% 88.05%,89.90% 90.25%,87.63% 93.10%,86.20% 96.43%,85.71% 100.00%,14.29% 100.00%,13.80% 96.43%,12.37% 93.10%,10.10% 90.25%,7.14% 88.05%,3.70% 86.68%,-0.00% 86.21%)}
.c-numb .shp>u{font-size:7.4cqw}
.c-fm{position:absolute;left:1.8cqw;top:23.6cqw;width:10.4cqw;text-align:center;z-index:3;font-size:3.6cqw;line-height:1.15}
.c-form.up{color:#0b7a3f}.c-form.dn{color:#b3261e}
.c-prov{font-size:2.6cqw;color:#000;opacity:.65;margin-top:.6cqw}
.c-st{position:absolute;left:7cqw;right:7cqw;top:95.8cqw;display:flex;z-index:3}
.c-st div{flex:1;display:flex;flex-direction:column;align-items:center;gap:.7cqw;position:relative}
.c-st div+div:before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:.2cqw;background:rgba(0,0,0,.28)}
.c-st span{font-size:4.2cqw;letter-spacing:.12em;opacity:.7;font-family:system-ui,'Arial Narrow',sans-serif;font-weight:700}
.c-st b{font-size:8.8cqw;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.c-meta{position:absolute;left:14cqw;right:14cqw;top:114cqw;text-align:center;font-size:4cqw;letter-spacing:.1em;opacity:.65;z-index:3;font-family:system-ui,'Arial Narrow',sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-ok{position:absolute;left:50%;top:118.6cqw;width:6.6cqw;height:6.6cqw;margin-left:-3.3cqw;border-radius:50%;background:#16a34a;border:.5cqw solid #fff;box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.4);color:#fff;font-size:4.4cqw;line-height:5.6cqw;text-align:center;z-index:5;font-family:system-ui,sans-serif;font-weight:900}

.formb{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:800}
.formb.up{background:#2b3512;color:#34d399}.formb.dn{background:#3b1519;color:#fca5a5}.formb.z{background:var(--bg2);color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.ev-card{border-left:4px solid var(--ac)}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.rsvp button{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 4px;font-size:13px;cursor:pointer}
.rsvp button.on.y{background:#2b3512;border-color:#34d399;color:#34d399;font-weight:700}
.rsvp button.on.m{background:#3f3a10;border-color:#facc15;color:#facc15;font-weight:700}
.rsvp button.on.n{background:#3b1519;border-color:#f87171;color:#fca5a5;font-weight:700}
textarea{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;background:var(--bg2);color:var(--mut);border:1px solid var(--line)}
/* avatar */
.av{border-radius:50%;background:var(--bg2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
/* player detail */
.pd-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.pd-photo{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:800;color:var(--mut)}
.pd-photo img{width:100%;height:100%;object-fit:cover}
.pd-ovr{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);border-radius:10px;padding:2px 10px;font-size:26px;font-weight:900;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.tile b{display:block;font-size:20px}
.tile span{font-size:11px;color:var(--mut)}
.attr{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.attr div{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
.attr2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.attr2 .acol{display:flex;flex-direction:column;gap:8px;min-width:0}
.attr2 .agrp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.attr2 .ahd{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:3px;font-weight:700;font-size:11px;letter-spacing:.3px}
.attr2 .arow{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11px;padding:3px 0;border-bottom:1px solid var(--line)}
.attr2 .arow:last-child{border-bottom:none}
.attr2 .arow span:first-child{flex:1;min-width:0;white-space:normal;word-break:break-word;color:var(--mut)}
.attr2 .arow span:last-child{flex:none;font-weight:800}
.v{font-weight:800}
.v.h{color:#34d399}.v.m{color:#a3e635}.v.l{color:#fb923c}.v.z{color:#f87171}
/* pitch */
.pitch{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;background:repeating-linear-gradient(0deg,#1f7a3d 0 10%,#238545 10% 20%);border:2px solid #dfe9e1;overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.6)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border:2px solid rgba(255,255,255,.6);border-radius:50%}
.box{position:absolute;left:25%;right:25%;height:14%;border:2px solid rgba(255,255,255,.6)}
.box.t{top:0;border-top:0}.box.b{bottom:0;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;z-index:2;touch-action:none;cursor:pointer}
.slot .circ{width:46px;height:46px;margin:0 auto;border-radius:50%;border:2px dashed rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;background:rgba(0,0,0,.18);position:relative}
.slot.f .circ{border:2px solid #fff;background:var(--card)}
.slot.sel .circ{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.5)}
.slot .circ img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.slot .bd{position:absolute;right:-6px;top:-6px;background:var(--gold);color:#221a00;border-radius:8px;font-size:10px;font-weight:900;padding:0 4px}
.slot .nm{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.slot .rl{font-size:9px;color:#dbeafe;opacity:.9}
.bench{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.bchip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 8px;touch-action:none;cursor:grab;user-select:none;font-size:13px}
.bchip.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,197,66,.5)}
.bchip .o{font-weight:900;color:var(--gold)}
.bchip .x{color:var(--mut);padding:0 3px;cursor:pointer}
.ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%);opacity:.9}
/* team lists */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trow{display:flex;align-items:center;gap:6px;padding:6px 6px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent}
.trow.sel{border-color:var(--gold);background:rgba(245,197,66,.1)}
.trow .r{width:34px;color:var(--mut);font-size:11px;font-weight:700}
.trow .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .o{font-weight:900;color:var(--gold)}
.trow.bn{opacity:.65}
.meter{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
/* score */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.score .t{font-weight:700}
.score .n{font-size:44px;font-weight:900;letter-spacing:2px}
.evgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.evgrid button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 4px;font-size:13px;cursor:pointer}
.evgrid button i{display:block;font-style:normal;font-size:22px}
.ev{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev .m{width:34px;color:var(--mut);font-size:12px}
.bdg{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800}
.bdg.g{background:#2b3512;color:#34d399}.bdg.y{background:#3f3a10;color:#facc15}.bdg.r{background:#3b1519;color:#fca5a5}
input[type=range]{width:100%;accent-color:var(--ac)}
/* modal */
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
body:has(#modal.on){overflow:hidden}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px 16px 26px}
@media(min-width:760px){#modal{align-items:center}.sheet{border-radius:18px}}

<header><h1>MIS<span>TER</span> <small id="ver" style="font-size:10px;font-weight:400;letter-spacing:1px;color:#555;vertical-align:middle"></small></h1><div class="hb"><button class="bell" data-act="bell" aria-label="Notifiche">🔔<i id="bdg"></i></button><button class="btn sec sm" data-act="menu">Impostazioni</button></div></header>

<script>
'use strict';
/* ===== util ===== */
const $=(s,e=document)=>e.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const ini=n=>(n||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const avg=a=>{if(!a.length)return 0;if(a.length<7)return a.reduce((x,y)=>x+y,0)/a.length;const sorted=[...a].sort((x,y)=>x-y);const trimmed=sorted.slice(1,-1);return trimmed.reduce((x,y)=>x+y,0)/trimmed.length};
function toast(m,ms=1800){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}

/* ===== stato ===== */
const KEY='mister_v1',UIKEY='mister_ui';
const freshUI=()=>({tab:'home',pid:null,rid:null,mid:null,fil:'all',q:'',previewPlayer:false,sub:{players:'all',calcio:'match',rank:'goals'},from:null,allTime:false});
const freshSetup=()=>({format:7,A:null,B:null,pool:[]});
const fresh=()=>({players:[],rosters:[],matches:[],events:[],rsvps:[],ratings:[],links:[],pairs:[],mvotes:[],notifs:[],feedback:[],fbvotes:[],seasons:[],live:null,setup:freshSetup(),ui:freshUI()});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=fresh()}
try{S.ui=Object.assign(freshUI(),JSON.parse(localStorage.getItem(UIKEY))||S.ui||{})}catch(e){}
S.ui.sub=Object.assign({players:'all',calcio:'match',rank:'goals'},S.ui.sub||{});
if(S.ui.tab==='match'){S.ui.tab='calcio';S.ui.sub.calcio='match'}else if(S.ui.tab==='res'){S.ui.tab='calcio';S.ui.sub.calcio='res'}
const clone=v=>JSON.parse(JSON.stringify(v));
/* --- normalizzazione: il db può omettere array/oggetti vuoti --- */
const nTeam=t=>t?Object.assign(t,{pids:t.pids||[],played:t.played}):t;
function normSetup(x){x=Object.assign(freshSetup(),x||{});x.pool=x.pool||[];nTeam(x.A);nTeam(x.B);return x}
function normLive(x){if(!x)return null;x.events=x.events||[];x.ratings=x.ratings||{};nTeam(x.A);nTeam(x.B);return x}
const NORM={
 players:p=>{p.roles=p.roles&&p.roles.length?p.roles:['CM'];p.s=p.s||{};p.name=p.name||'';return p},
 rosters:r=>{r.pids=r.pids||[];const l=r.lineup||[];r.lineup=Array.from({length:r.format||7},(_,i)=>l[i]||null);return r},
 matches:m=>{m.events=m.events||[];m.ratings=m.ratings||{};m.evo=m.evo||{};m.ovrs=m.ovrs||{};m.awards=m.awards||{};nTeam(m.A);nTeam(m.B);return m},
 events:e=>e,rsvps:r=>r,links:l=>l,pairs:x=>x,mvotes:x=>{x.v=x.v||{};return x},notifs:n=>n,feedback:f=>f,fbvotes:f=>f,seasons:x=>{x.champs=x.champs||{};return x},
 ratings:r=>{r.s=r.s||{};r.log=r.log||[];return r}
};
const ALLCOLS=['players','rosters','matches','events','rsvps','ratings','links','pairs','mvotes','notifs','feedback','fbvotes','seasons'];
let ADM=!window.claude,UID=null,USER=null;
const canWrite=path=>ADM||/^(ratings|rsvps|links|rosters|mvotes|notifs|feedback|fbvotes)\//.test(path)||(!!myPid()&&path==='players/'+myPid());
const VA=()=>ADM&&!S.ui.previewPlayer;
const RE=()=>ADM||!!UID;
S.setup=normSetup(S.setup);S.live=normLive(S.live);
/* --- sync db condiviso --- */
let DB=null,ready=false,inflight=0,pending={},chain=Promise.resolve(),stale=false;
const shadow=new Map();
const stab=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(q=>[q,x[q]])):x);
function docsOf(){const m=new Map();S.players.forEach(p=>m.set('players/'+p.id,p));S.rosters.forEach(r=>m.set('rosters/'+r.id,r));S.matches.forEach(x=>m.set('matches/'+x.id,x));['events','rsvps','ratings','links','pairs','mvotes','notifs','feedback','fbvotes','seasons'].forEach(c=>S[c].forEach(x=>m.set(c+'/'+x.id,x)));m.set('state/setup',{data:S.setup});m.set('state/live',{data:S.live});return m}
function enqueue(fn){inflight++;chain=chain.then(fn).catch(e=>{toast(e&&e.code==='invalid_argument'?'Sola lettura: non puoi modificare':'Errore di sincronizzazione')}).finally(()=>{inflight--;if(!inflight){const p=Object.values(pending);pending={};p.forEach(f=>f())}})}
function save(){
 try{localStorage.setItem(UIKEY,JSON.stringify(S.ui))}catch(e){}
 if(!DB){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Memoria piena: esporta un backup')}return}
 if(!ready)return;
 const cur=docsOf();
 for(const [path,val] of cur){const j=stab(val);if(shadow.get(path)!==j){shadow.set(path,j);if(canWrite(path))enqueue(()=>DB.doc(path).set(JSON.parse(j)))}}
 for(const path of [...shadow.keys()])if(!cur.has(path)){shadow.delete(path);if(canWrite(path))enqueue(()=>DB.doc(path).delete())}
}
function afterRemote(){
 if($('#modal').classList.contains('on')||DR||MEDIT||(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))){stale=true;return}
 stale=false;render();
}
async function initDB(){
 try{DB=window.claude?await window.claude.use('db'):null}catch(e){DB=null}
 if(!DB){ADM=!window.claude;return}
 try{USER=await window.claude.use('user');if(USER){UID=await USER.id();ADM=!!(USER.canEdit()||USER.isOwner())}else ADM=false}catch(e){ADM=false}
 const legacy=ADM&&S.players.length?JSON.parse(JSON.stringify(S)):null;
 let n=0;const first=()=>{if(++n<ALLCOLS.length+2)return;ready=true;
  if(legacy&&!S.players.length&&!S.rosters.length&&!S.matches.length){S.players=legacy.players;S.rosters=legacy.rosters;S.matches=legacy.matches;save();toast('Dati locali caricati online')}
  render()};
 let got={};
 const err=e=>toast('Sync non disponibile'+(e&&e.code?' ('+e.code+')':''));
 const applyCol=(name,snap)=>{for(const k of [...shadow.keys()])if(k.startsWith(name+'/'))shadow.delete(k);
   S[name]=snap.docs.map(d=>{const v=NORM[name](clone(d.data()));shadow.set(name+'/'+d.id,stab(v));return v})};
 const applyDoc=(k,snap)=>{const v=snap.exists?clone(snap.data()):null;if(v)shadow.set('state/'+k,stab(v));else shadow.delete('state/'+k);const x=v&&v.data;if(k==='setup')S.setup=normSetup(x);else S.live=normLive(x)};
 const handle=(key,snap,get,apply)=>{
  if(inflight&&ready){pending[key]=()=>get().then(sn=>{apply(sn);afterRemote()}).catch(()=>{});return}
  apply(snap);if(ready)afterRemote()};
 ALLCOLS.forEach(name=>{
  DB.collection(name).onSnapshot(snap=>{
   handle(name,snap,()=>DB.collection(name).get(),sn=>applyCol(name,sn));
   if(!got[name]){got[name]=1;first()}
  },err)});
 ['setup','live'].forEach(k=>{
  DB.doc('state/'+k).onSnapshot(snap=>{
   handle('state/'+k,snap,()=>DB.doc('state/'+k).get(),sn=>applyDoc(k,sn));
   if(!got[k]){got[k]=1;first()}
  },err)});
}

/* ===== statistiche & overall ===== */
const GROUPS=[
 {id:'por',name:'Portiere',stats:[['div','Tuffo'],['han','Presa'],['ref','Riflessi'],['kic','Rinvio'],['gpo','Piazz. portiere']]},

/* storico overall partita per partita */
function ovrChart(p,Wd){
 const ms=S.matches.slice().sort((a,b)=>a.date-b.date).filter(m=>m.ovrs&&m.ovrs[p.id]!=null);
 const pts=ms.map((m,i)=>({v:m.ovrs[p.id],pl:!!playedIn(m,p.id),t:`Partita ${i+1}: ${m.ovrs[p.id]}${playedIn(m,p.id)?'':' (assente)'}`}));
 pts.push({v:ovr(p),pl:false,now:true,t:'Ora: '+ovr(p)});
 if(pts.length<2)return'<div class="mut small">Lo storico si costruisce partita dopo partita: ora '+ovr(p)+'.</div>';
 const W=Wd||340,H=170,L=28,R=12,T=14,B=26,vs=pts.map(x=>x.v);
 let lo=Math.floor(Math.min(...vs)-2),hi=Math.ceil(Math.max(...vs)+2);if(hi-lo<6){lo-=2;hi+=2}
 const X=i=>L+(W-L-R)*i/(pts.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 const step=Math.max(1,Math.ceil((hi-lo)/4)),grid=[];for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)grid.push(v);
 const every=Math.ceil(pts.length/(W<300?5:8));
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Storico overall">
 ${grid.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#35353b" stroke-width="1"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#9096a0">${v}</text>`).join('')}
 <polyline fill="none" stroke="#d1ff42" stroke-width="2" stroke-linejoin="round" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>
 ${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="${x.now?4.5:3.5}" fill="${x.pl||x.now?'#d1ff42':'#0e0e10'}" stroke="#d1ff42" stroke-width="1.6"><title>${esc(x.t)}</title></circle>${i%every===0||x.now?`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="9" fill="#9096a0">${x.now?'ora':i+1}</text>`:''}`).join('')}
 </svg><div class="small mut" style="margin-top:4px">● giocata · ○ assente · x: partite</div>`;
}

const pairId=(a,b)=>[a,b].sort().join('_');
const relOf=(a,b)=>{const r=S.pairs.find(x=>x.id===pairId(a,b));return r?r.rel:null};
function pairStats(id){
 const o={};S.matches.forEach(m=>{const T=playedIn(m,id);if(!T)return;const own=T==='A'?m.sa:m.sb,opp=T==='A'?m.sb:m.sa,res=own>opp?1:own===opp?.5:0;
  (m[T].played||m[T].pids).forEach(q=>{if(q===id||!getP(q))return;const x=o[q]=o[q]||{n:0,w:0,d:0,l:0,pts:0};x.n++;x.pts+=res;res===1?x.w++:res===.5?x.d++:x.l++})});
 return o;
}
function chemHTML(p){
 const ps=pairStats(p.id),rows=Object.entries(ps).filter(([q,x])=>x.n>=2).map(([q,x])=>({q,...x,r:x.pts/x.n})).sort((a,b)=>b.r-a.r);
 const rel=S.pairs.filter(r=>r.a===p.id||r.b===p.id).map(r=>({q:r.a===p.id?r.b:r.a,rel:r.rel})).filter(r=>getP(r.q));
 const line=x=>`<div class="row sp small" style="padding:3px 0"><span>${esc(nm(x.q))}</span><span class="mut">${x.w}V ${x.d}N ${x.l}P · <b style="color:${x.r>=.6?'#34d399':x.r<=.4?'#f87171':'var(--tx)'}">${Math.round(x.r*100)}%</b></span></div>`;
 return`<div class="panel">
 ${rel.length?`<div class="row wrap" style="margin-bottom:8px">${rel.map(r=>`<span class="chip" style="${r.rel==='friend'?'border-color:#34d399;color:#34d399':'border-color:#f87171;color:#fca5a5'}">${r.rel==='friend'?'🤝':'⚔️'} ${esc(nm(r.q))}</span>`).join('')}</div>`:''}
 ${rows.length?`<div class="small mut" style="font-weight:700;margin-bottom:2px">RENDIMENTO IN COPPIA (min. 2 partite)</div>${rows.slice(0,3).map(line).join('')}${rows.length>3?`<div class="small mut" style="margin:6px 0 2px">Peggiori</div>${rows.slice(-2).reverse().map(line).join('')}`:''}`:'<div class="mut small">Servono almeno 2 partite insieme per calcolare la chimica.</div>'}
 ${VA()?`<div class="row" style="margin-top:8px"><button class="btn sec sm" data-act="relNew" data-id="${p.id}">Imposta relazione</button></div>`:''}</div>`;
}
function pairPen(ids){let c=0;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const r=relOf(ids[i],ids[j]);if(r==='rival')c+=3;else if(r==='friend')c-=.6}return c}

/* ---------- carosello con swipe ---------- */
function carousel(id,items,lock){

 return`<div class="cbar" data-cb="${id}">${items.map(([k,l])=>`<span class="cchip ${k===cur?'on':''}" data-act="cgo" data-c="${id}" data-k="${k}" data-kk="${k}">${l}</span>`).join('')}</div><div class="car${lock?' lock':''}" data-car="${id}" data-keys="${items.map(i=>i[0]).join(',')}" data-cur="${cur}">${items.map(([k,l,h])=>`<section class="cpan" data-k="${k}">${h}</section>`).join('')}</div>`;

let CRO=null;
function carSync(){
 if(CRO)CRO.disconnect();
 CRO=window.ResizeObserver?new ResizeObserver(()=>document.querySelectorAll('[data-car]').forEach(c=>{const p=c.children[c.dataset.keys.split(',').indexOf(c.dataset.cur)];if(p)c.style.height=p.offsetHeight+'px'})):null;
 document.querySelectorAll('[data-car]').forEach(c=>{
  const i=Math.max(0,c.dataset.keys.split(',').indexOf(c.dataset.cur)),p=c.children[i];
  if(c.clientWidth)c.scrollTo({left:i*c.clientWidth,behavior:'instant'});
  if(p)c.style.height=p.offsetHeight+'px';
  if(CRO)[...c.children].forEach(x=>CRO.observe(x));
 });
}

/* swipe tra le sotto-schede ovunque nella schermata (niente zone morte fuori dal carosello) */
(function(){let t=null;
 document.addEventListener('touchstart',e=>{const x=e.touches[0];t=e.touches.length===1?{x:x.clientX,y:x.clientY,el:e.target}:null},{passive:true});
 document.addEventListener('touchend',e=>{
  if(!t)return;const s=t;t=null;const c=e.changedTouches[0],dx=c.clientX-s.x,dy=c.clientY-s.y;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;
  if($('#modal').classList.contains('on')||TOUR.on)return;
  const el=s.el;if(!el||!el.closest||el.closest('.car,.cbar,input,select,textarea,.pitch,[data-drag],#modal,nav'))return;
  const car=document.querySelector('#view [data-car]');if(!car||car.classList.contains('lock'))return;
  const keys=car.dataset.keys.split(','),i=keys.indexOf(car.dataset.cur),n=i+(dx<0?1:-1);
  if(n<0||n>=keys.length)return;A.cgo({c:car.dataset.car,k:keys[n]});
 },{passive:true});
})();

/* ---------- stagioni, classifiche, albo d'oro ---------- */
const SF=()=>S.seasons.reduce((a,s)=>Math.max(a,s.at),0);
function lbData(from){
 const R=S.players.map(p=>({p,s:pstats(p.id,from)})),aw={};
 S.matches.forEach(m=>{if(from&&m.date<from)return;Object.values(m.awards||{}).forEach(v=>{if(v)aw[v]=(aw[v]||0)+1})});
 const pres=r=>r.s.app+(r.s.app===1?' presenza':' presenze');
 return{
  goals:R.filter(r=>r.s.g>0).sort((a,b)=>b.s.g-a.s.g||a.s.app-b.s.app).map(r=>[r.p,r.s.g,pres(r)]),
  assist:R.filter(r=>r.s.a>0).sort((a,b)=>b.s.a-a.s.a||a.s.app-b.s.app).map(r=>[r.p,r.s.a,pres(r)]),
  mvp:R.filter(r=>r.s.mv>0).sort((a,b)=>b.s.mv-a.s.mv||a.s.app-b.s.app).map(r=>[r.p,r.s.mv,pres(r)]),
  avg:R.filter(r=>r.s.rt.length>=3).sort((a,b)=>b.s.avg-a.s.avg).map(r=>[r.p,r.s.avg.toFixed(2),r.s.rt.length+' partite']),
  form:R.filter(r=>r.s.app>=2).sort((a,b)=>(b.p._f||0)-(a.p._f||0)||ovr(b.p)-ovr(a.p)).map(r=>[r.p,(r.p._f>0?'+':'')+(r.p._f||0),r.p.roles[0]]),
  ovr:S.players.slice().sort((a,b)=>ovr(b)-ovr(a)).map(p=>[p,ovr(p),p.roles[0]]),
  awards:S.players.filter(p=>aw[p.id]).sort((a,b)=>aw[b.id]-aw[a.id]).map(p=>[p,aw[p.id],'premi vinti'])
 };
}
const MEDAL=['🥇','🥈','🥉'];
function lbPanel(rows,note){
 if(!rows.length)return`<div class="empty">Ancora nessun dato.</div>`;
 return`<div class="panel" style="padding:4px 12px">${rows.slice(0,15).map(([p,v,sub],i)=>`<div class="lbr" data-act="openP" data-id="${p.id}" data-from="rank"><span class="pos">${i<3?MEDAL[i]:i+1}</span>${av(p,34)}<div class="grow" style="min-width:0"><b class="ell">${esc(p.name)}</b><div class="small mut">${sub}</div></div><b class="lv">${v}</b></div>`).join('')}</div>${note?`<div class="small mut" style="text-align:center;margin-top:-4px">${note}</div>`:''}`;

function monthlyAlbo(){
 const g={},d0=new Date(),nowK=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0');
 S.matches.forEach(m=>{const d=new Date(m.date),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');(g[k]=g[k]||[]).push(m)});
 const best=o=>{let b=null,v=0;Object.entries(o).forEach(([id,n])=>{if(getP(id)&&n>v){v=n;b=id}});return b?[b,v]:null};
 return Object.keys(g).sort().reverse().map(k=>{
  const G={},As={},MV={};
  g[k].forEach(m=>{m.events.forEach(e=>{if(e.type==='goal'||e.type==='pen')G[e.pid]=(G[e.pid]||0)+1;if(e.ass)As[e.ass]=(As[e.ass]||0)+1});const mv=(m.awards&&m.awards.mvp)||m.motm;if(mv)MV[mv]=(MV[mv]||0)+1});
  return{k,label:MESI[+k.slice(5)-1]+' '+k.slice(0,4),open:k===nowK,n:g[k].length,goal:best(G),assist:best(As),mvp:best(MV)};
 });
}
function alboHTML(){

 const line=(i,l,w)=>w?`<div class="row sp small" style="padding:3px 0"><span>${i} ${l}</span><b data-act="openP" data-id="${w[0]}" data-from="rank" style="cursor:pointer">${esc(nm(w[0]))} <span class="mut">${w[1]}</span></b></div>`:'';
 const sline=(i,l,id)=>id&&getP(id)?`<div class="row sp small" style="padding:3px 0"><span>${i} ${l}</span><b data-act="openP" data-id="${id}" data-from="rank" style="cursor:pointer">${esc(nm(id))}</b></div>`:'';
 return`${VA()?`<button class="btn sec blk" data-act="seasonClose" style="margin-bottom:10px">🏁 Chiudi stagione</button>`:''}
 ${Sx.map(s=>`<div class="panel" style="border-color:var(--gold)"><b>🏆 ${esc(s.name)}</b><div class="small mut" style="margin-bottom:4px">chiusa il ${fdate(s.at,{day:'numeric',month:'long',year:'numeric'})}</div>${sline('⚽','Capocannoniere',s.champs.goals)}${sline('🅰️','Assistman',s.champs.assist)}${sline('⭐','MVP',s.champs.mvp)}${sline('📊','Miglior voto',s.champs.avg)}</div>`).join('')}

}
function titlesOf(id){
 let m=0,s=0;monthlyAlbo().forEach(x=>{if(x.open)return;[x.goal,x.assist,x.mvp].forEach(w=>{if(w&&w[0]===id)m++})});
 S.seasons.forEach(se=>Object.values(se.champs||{}).forEach(v=>{if(v===id)s++}));
 return{m,s};
}

/* ---------- bacheca e traguardi ---------- */
function trophies(id){const c={};S.matches.forEach(m=>Object.entries(m.awards||{}).forEach(([k,v])=>{if(v===id)c[k]=(c[k]||0)+1}));return c}
/* [id, icona, nome, descrizione, sbloccato, valore, obiettivo] */
function achOf(p){
 const st=pstats(p.id),ms=S.matches.filter(m=>playedIn(m,p.id)).sort((a,b)=>a.date-b.date);
 let hat=false,r9=false,run=0,best=0;
 ms.forEach(m=>{
  if(m.events.filter(e=>e.pid===p.id&&(e.type==='goal'||e.type==='pen')).length>=3)hat=true;
  const r=mr(m,p.id);if(r!=null&&r>=9)r9=true;
  if(m.awards&&m.awards.mvp===p.id){run++;best=Math.max(best,run)}else run=0;
 });
 const mk=(id,ico,n,d,v,mx)=>[id,ico,n,d,v>=mx,Math.min(v,mx),mx];
 return[
  mk('debut','🎽','Esordio','Prima presenza',st.app,1),
  mk('p10','🔟','Veterano','10 presenze',st.app,10),
  mk('p25','🛡️','Colonna','25 presenze',st.app,25),
  mk('g1','⚽','Si sblocca','Primo gol',st.g,1),
  mk('g10','🎯','Cecchino','10 gol',st.g,10),
  mk('hat','🎩','Tripletta','3 gol in una partita',hat?1:0,1),
  mk('a5','🅰️','Uomo assist','5 assist',st.a,5),
  mk('mvp1','⭐','MVP','Primo premio MVP',(trophies(p.id).mvp||0),1),
  mk('mvp3','🔥','Tris di MVP','3 MVP di fila',best,3),
  mk('cs5','🧤','Saracinesca','5 clean sheet',st.cs,5),
  mk('r9','💎','Partita da 9','Voto finale ≥ 9',r9?1:0,1),
  mk('evo','📈','In crescita','Ottieni un +1 di crescita',p._ev||0,1)
 ];
}
function premiHTML(p){

function tourOther(){const me=myPid();const l=S.players.slice().sort((a,b)=>ovr(b)-ovr(a));return l.find(x=>x.id!==me)||l[0]||null}
function tourDOM(){let t=$('#tour');if(!t){t=document.createElement('div');t.id='tour';document.body.appendChild(t)}return t}
function tourIntro(){
 TOUR.intro=true;const t=tourDOM();t.className='on intro';
 t.innerHTML=`<div class="tbox mid"><div style="font-size:42px;text-align:center">⚽</div><h2 style="text-align:center;margin:6px 0 8px">Benvenuto!</h2><div style="text-align:center;font-size:15px;line-height:1.45">Ormai sei un giocatore di Mister! Preferisci imparare da solo o vieni con me per un breve tour tra le funzioni dell'app?</div><div class="row" style="margin-top:16px;gap:8px"><button class="btn sec grow" data-act="tourSkip">Imparo da solo</button><button class="btn grow" data-act="tourBegin">Guidami grazie!</button></div></div>`;
}
function tourStart(){
 const m=$('#modal');if(m.classList.contains('on'))closeModal();
 const u=S.ui;TOUR.save={tab:u.tab,pid:u.pid,mid:u.mid,cmp:u.cmp,rid:u.rid,sub:Object.assign({},u.sub)};
 TOUR.steps=TSTEPS.filter(s=>!s.when||s.when());TOUR.i=0;TOUR.on=true;TOUR.intro=false;
 tourMark();tourShow();
}
function tourEnd(){
 const t=$('#tour');if(t){t.className='';t.innerHTML=''}
 TOUR.intro=false;if(!TOUR.on)return;TOUR.on=false;
 const s=TOUR.save;if(s){Object.assign(S.ui,{tab:s.tab,pid:s.pid,mid:s.mid,cmp:s.cmp,rid:s.rid});S.ui.sub=Object.assign(S.ui.sub||{},s.sub);saveUI();render();window.scrollTo(0,0)}
 TOUR.save=null;
}
function tourShow(){
 const st=TOUR.steps[TOUR.i];if(!st)return tourEnd();
 const eff={sub:{}};
 for(let k=0;k<=TOUR.i;k++){const q=TOUR.steps[k].go;if(q)Object.assign(eff,q,{sub:Object.assign(eff.sub,q.sub||{})})}
 {const u=S.ui;
  if(eff.tab)u.tab=eff.tab;
  if('pid' in eff)u.pid=eff.pid==='other'?(tourOther()||{}).id||null:eff.pid;
  if('mid' in eff)u.mid=eff.mid;
  u.cmp=false;
  u.sub=Object.assign(u.sub||{},eff.sub);
  SEL=null;render();window.scrollTo(0,0);
 }
 tourPlace();setTimeout(()=>TOUR.on&&tourPlace(),250);
}
function tourPlace(){
 if(!TOUR.on)return;
 const st=TOUR.steps[TOUR.i];if(!st)return;
 const t=tourDOM(),n=TOUR.steps.length,i=TOUR.i;
 let els=(st.sel||[]).map(s=>document.querySelector(s)).filter(e=>e&&e.offsetHeight>20);
 const mid=!els.length||st.pos==='center';
 const miss=st.sel&&!els.length;
 const hh=($('header')||{offsetHeight:56}).offsetHeight,vh=window.innerHeight,vw=window.innerWidth;
 const rect=()=>{let r=null;els.forEach(e=>{const b=e.getBoundingClientRect();r=r?{l:Math.min(r.l,b.left),t:Math.min(r.t,b.top),r:Math.max(r.r,b.right),b:Math.max(r.b,b.bottom)}:{l:b.left,t:b.top,r:b.right,b:b.bottom}});return r};
 const fixed=els.length&&els.every(e=>e.closest('header,nav'));
 const body=`<div class="tp"><i style="width:${Math.round((i+1)/n*100)}%"></i></div><div class="tsec">${st.sec} · ${i+1}/${n}</div><h3>${st.t}</h3><div class="tx">${miss?'<div class="small mut" style="margin-bottom:6px">(Ora non c\'è nulla da mostrare qui, ma funziona così)</div>':''}${st.x}</div><div class="row tb"><button class="btn sec sm" data-act="tourEnd">Salta</button><span class="grow"></span>${i?`<button class="btn sec sm" data-act="tourPrev">‹ Indietro</button>`:''}<button class="btn sm" data-act="tourNext">${i===n-1?'Fine ✓':'Avanti ›'}</button></div>`;
 t.className='on';
 if(mid){t.className='on intro';
  t.innerHTML=`<div class="tbox mid">${body}</div>`;return;
 }
 const top=st.pos==='top'||(fixed&&els[0].closest('nav'));
 t.innerHTML=`<div class="tspot"></div><div class="tbox ${top?'tt':'tbt'}" ${top?`style="top:${hh+8}px"`:''}>${body}</div>`;
 const box=t.querySelector('.tbox'),th=box.offsetHeight,navH=($('#nav')||{offsetHeight:70}).offsetHeight;
 const lo=top?hh+th+24:hh+10,hi=top?vh-navH-14:vh-th-24;
 if(!fixed){
  let r=rect();const h=r.b-r.t,room=hi-lo,y=window.scrollY;
  const want=h>room?r.t-lo:(r.t+h/2)-(lo+room/2);
  window.scrollTo(0,Math.max(0,y+want));
 }
 const r=rect();let T=Math.max(r.t,lo),B=Math.min(r.b,hi);if(fixed||B<T+10){T=r.t;B=r.b}
 const sp=t.querySelector('.tspot'),pad=6;
 sp.style.cssText=`left:${Math.max(4,r.l-pad)}px;top:${T-pad}px;width:${Math.min(vw-8,r.r-r.l+pad*2)}px;height:${B-T+pad*2}px`;
}

 fbSave:d=>{const t=$('#fbT').value.trim();if(!t){toast('Scrivi un titolo');return}
  S.feedback.push({id:uid(),kind:d.k,title:t,text:$('#fbX').value.trim(),by:FV(),pid:myPid()||null,at:Date.now(),status:'new'});save();toast('Inviato ✓');fbList(d.k)},
 fbPoll:d=>openModal(`<h2>🗳 Indici votazione</h2><p class="small mut">Per quanto tempo possono votare i giocatori?</p><div class="row wrap" style="gap:8px">${[[1,'24 ore'],[3,'3 giorni'],[7,'7 giorni']].map(([n,l])=>`<button class="btn sec grow" data-act="fbPollGo" data-id="${d.id}" data-days="${n}">${l}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn sec grow" data-act="fbBack" data-k="tip">Annulla</button></div>`),
 fbPollGo:d=>{const f=S.feedback.find(x=>x.id===d.id);if(!f)return;f.poll={start:Date.now(),until:Date.now()+(+d.days)*864e5};f.status='poll';
  S.fbvotes=S.fbvotes.filter(v=>v.f!==f.id);save();NT('feedback','💡 Nuova votazione',f.title,'./?fb='+f.id,null);fbList('tip')},
 fbEnd:d=>{const f=S.feedback.find(x=>x.id===d.id);if(!f||!f.poll)return;f.poll.until=Date.now()-1;save();fbList('tip')},
 fbVote:d=>{const f=S.feedback.find(x=>x.id===d.id);if(!f||!pollOpen(f)){toast('Votazione chiusa');return}
  const id=f.id+'_'+FV();let r=S.fbvotes.find(x=>x.id===id);if(!r){r={id,f:f.id,r:FV(),v:d.v};S.fbvotes.push(r)}r.v=d.v;r.at=Date.now();save();fbList('tip')},
 fbSet:d=>{const f=S.feedback.find(x=>x.id===d.id);if(!f)return;f.status=d.s;save();
  const lb=(FB_ST[f.kind][d.s]||[])[1];if(f.pid&&f.pid!==myPid())NT('feedback',f.kind==='bug'?'🐞 Aggiornamento sul tuo bug':'💡 Aggiornamento sul tuo consiglio',`${f.title} → ${lb}`,'./?fb='+f.id,[f.pid]);fbList(f.kind)},
 fbDel:d=>ASK('Eliminare definitivamente?',()=>{const f=S.feedback.find(x=>x.id===d.id),k=f?f.kind:FBK;S.feedback=S.feedback.filter(x=>x.id!==d.id);S.fbvotes=S.fbvotes.filter(v=>v.f!==d.id);save();fbList(k)}),
});
Object.assign(A,{nbClick:()=>{const b=$('#nbanner');b.classList.remove('on');if(NBN){markRead([NBN.id]);goUrl(NBN.url);render();window.scrollTo(0,0)}},backRosa:()=>{S.ui.tab='players';S.ui.rid=null;render();window.scrollTo(0,0)},
 changelog:()=>{const adm=VA();openModal(`<h2>🆕 Novità</h2><div class="small mut" style="margin-bottom:10px">Cosa cambia ad ogni aggiornamento</div>${CHANGELOG.map(c=>{const its=c.items.filter(i=>adm||!i[2]);if(!its.length)return'';return`<div class="panel"><div class="row sp" style="margin-bottom:2px"><b>v${c.v}</b><span class="small mut">${c.d}</span></div>${['new','imp','bug'].map(k=>{const L=its.filter(i=>i[0]===k);return L.length?`<div class="cl-h">${CLT[k][0]} ${CLT[k][1].toUpperCase()}</div><ul style="margin:0;padding-left:18px">${L.map(x=>`<li style="margin:3px 0;font-size:13.5px">${esc(x[1])}${x[2]?' <span class="tag">admin</span>':''}</li>`).join('')}</ul>`:''}).join('')}</div>`}).join('')}`,`<div class="row"><button class="btn sec grow" data-act="closeM">Chiudi</button></div>`)}});

 const t=e.target;
 if((t.id==='phFile'||t.id==='phCam')&&t.files[0]){const mg=$('#phMsg');if(mg)mg.textContent='Elaboro la foto…';resizeImg(t.files[0],u=>{const me=myPid(),p=me&&getP(me);if(!p)return;p.photo=u;save();closeModal();render();toast('Foto salvata ✓')},260);return}
 if(t.id==='edFile'&&t.files[0]){resizeImg(t.files[0],u=>{ED.photo=u;$('#edPh').innerHTML=`<img src="${u}">`});return}
 if(t.id==='edPri'){edSync();return}
 if(t.dataset.rt&&S.live){S.live.ratings[t.dataset.rt]=+t.value;save();return}
 if(t.dataset.aw&&S.live){(S.live.awards=S.live.awards||{})[t.dataset.aw]=t.value;save();return}
 const c=t.dataset.ch;if(!c)return;const su=S.setup;
 if(c==='rform'){const r=curR();if(!canEditR(r))return;r.formation=t.value;r.lineup=assign(r.lineup.filter(Boolean),slotsOf(r.format,t.value));save();render()}
 else if(c==='tform'){su[t.dataset.t].formation=t.value;save();render()}
 else if(c==='tname'){su[t.dataset.t].name=t.value||'Squadra';save()}
 else if(c==='tload'&&t.value){const r=S.rosters.find(x=>x.id===t.value);su[t.dataset.t].pids=r.pids.slice();su[t.dataset.t].formation=r.formation;SEL2=null;save();render()}
 else if(c==='poolR'&&t.value){const r=S.rosters.find(x=>x.id===t.value);su.pool=r.pids.filter(id=>getP(id));save();render()}
});

 if(t.dataset.mv&&MV){MV.v[t.dataset.mv]=+t.value;$('#mv_'+t.dataset.mv).textContent=t.value}

/* zoom card: tieni premuto su una card */
(function(){let t=null,x0=0,y0=0,hit=false,tgt=null;
 const close=()=>{const z=document.getElementById('czoom');if(!z)return;z.classList.remove('on');setTimeout(()=>z.remove(),180)};
 const open=w=>{close();const z=document.createElement('div');z.id='czoom';const c=w.cloneNode(true);c.removeAttribute('data-act');c.removeAttribute('data-id');z.appendChild(c);z.addEventListener('click',e=>{e.stopPropagation();close()});z.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.body.appendChild(z);requestAnimationFrame(()=>requestAnimationFrame(()=>z.classList.add('on')));if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}};
 const cancel=()=>{clearTimeout(t);t=null};
 document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const w=e.target.closest&&e.target.closest('.cardw');if(!w||w.closest('#czoom'))return;x0=e.clientX;y0=e.clientY;tgt=w;cancel();t=setTimeout(()=>{t=null;hit=true;open(tgt)},450)},true);
 document.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10))cancel()},true);
 ['pointerup','pointercancel','scroll'].forEach(n=>document.addEventListener(n,()=>{cancel();if(hit)setTimeout(()=>{hit=false},350)},true));
 document.addEventListener('click',e=>{if(hit){hit=false;e.stopPropagation();e.preventDefault()}},true);
 document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.cardw'))e.preventDefault()});
})();
</script>
